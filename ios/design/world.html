  const note = (fell ? ` · в прошлый раз закрылось: ${STEPS[lastStep] || lastStep}` : '')
    + (treeTrouble ? ` · дерево не загрузилось: ${treeTrouble}` : '') + (lastTest ? ` · замер прервался: ${lastTest.name}` : '');
  renderer.setAnimationLoop(now => {
    if (document.hidden) return;
    if (lastDraw && now - lastDraw < 750/(measure ? CADENCE.full : paceTarget)) return;   // (¾ of a frame: a screen's uneven beat
                                                                       // must not drop a frame; a 120 Hz one still gets 60)
    lastDraw = now;
    if (measure){ measure(now); frames = 0; t0 = now; return; }
    draw(); frames++; pace(now);
    if (++total === 60) step('done');
    if (now - t0 > 1000){
      const sharp = (paceStep ? ` · чёткость ${renderer.getPixelRatio().toFixed(2).replace('.', ',')} (не держал 60)` : '')
        + (paceTarget < CADENCE.full ? ' · 30 кадров/с: телефон не держит 60, бережёт себя' : '');
      hud.textContent = `${Math.round(frames*1000/(now - t0))} кадров/с · ${renderer.backend.isWebGPUBackend ? 'WebGPU' : 'WebGL2'} · солнце ${SUN.az.toFixed(1)}°/${SUN.el.toFixed(1)}°${note}${sharp}`;
      frames = 0; t0 = now;
    }
  });
  window.world = {renderer, scene, camera, atmosphere, sun, cascades, pipeline, tree, field, fieldInfo, setSun, windStrength, windDir, parts, hazeDensity, airParts, sunMap, sunCam, sunView, frame, air, airAtlas, drawAir, fieldRT, groundRT, redrawShadows, treeWind, draw, SETTLE, settleKeep, crisp, settle, settled, sharpened, crownParts, treeColour, skyColour, sunSee, sunPeek, setMood, mood, cloudCover, cloudScale, cloudHorizon, cloudThick, cloudMist, cloudFar, cloudGain, cloudTarget, fallen, fallWind, skyTarget, skyScene, drawSky, startTest, SWITCHES, lastRun: () => run,
    pace, paceReset, paceState: () => ({step: paceStep, off: paceOff, trying: !!paceTry, pixels: renderer.getPixelRatio(), target: paceTarget}),
    setExposure: e => { renderer.toneMappingExposure = e; }};   // for checking from the console
} catch (err) {
  hud.textContent = 'Не запустилось: ' + err.message;
  step('done');                                                        // an error it could say, not a fall
  console.error(err);
}
</script>
