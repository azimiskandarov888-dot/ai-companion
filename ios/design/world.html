    const w = win; win = null;
    return {fps: w.dt.length ? r1(1000*w.dt.length/w.dt.reduce((s, x) => s + x, 0)) : null, frame: r1(quantile(w.dt, 0.5)),
      late: w.dt.length ? Math.round(100*w.dt.filter(x => x > 20).length/w.dt.length) : null,   // % of frames that missed the screen's 1/60 s
      frame95: r1(quantile(w.dt, 0.95)), frameMax: r1(w.dt.length ? Math.max(...w.dt) : null), gpu: r1(trimmed(w.gpu)),
      gpuMed: r1(quantile(w.gpu, 0.5)), gpu90: r1(quantile(w.gpu, 0.9)), gpuSum: r1(trimmed(w.gpuSum)), gpuN: w.gpu.length, done: r1(trimmed(w.done)),
      cpu: r1(quantile(w.cpu, 0.5)), draws: w.draws, drawsMin: Number.isFinite(w.drawsMin) ? w.drawsMin : null, tris: w.tris, frames: w.dt.length};
  }
  const awake = () => new Promise(r => { const f = () => { if (!document.hidden){ document.removeEventListener('visibilitychange', f); r(); } };
    document.addEventListener('visibilitychange', f); f(); });
  async function measured(warm, ms){                                   // let it settle, then listen; if the screen went dark, again
    for (let tries = 0; ; tries++){
      hiddenNow = false; await wait(warm); const s = await sample(ms);
      if (!hiddenNow || tries === 2) return hiddenNow ? {...s, dark: true} : s;
      tell([bold('Экран погас'), 'Продолжу, когда он снова включится.']); await awake(); warm = 2000;
    }
  }

  // what is changed, one at a time: the shadows' pace, a part off, or the steps the world takes down in pixels
  const showAll = (list, yes) => list.forEach(o => { o.visible = yes; });
  const fluffOf = part => { const mats = lookMats[fieldInfo.look]; return plants.children.filter(m => m.material === mats[part]); };
  let pixels0 = 1;
  const pixels = k => on => { renderer.setPixelRatio(on ? pixels0*k : pixels0); airSize(); };
  const sharpness = k => `чёткость ${(pixelsMax*k).toFixed(2).replace(/0$/, '').replace('.', ',')}`;
  const SWITCHES = [
    {key: 'still', name: 'тени застыли', set: on => { shadowTurns = !on; }, skip: () => SHADOWS !== 'turns' || !cascades.lights.length},
    {key: 'turns2', name: 'ближние тени через кадр', set: on => { turnEvery = on ? 2 : 3; }, skip: () => SHADOWS !== 'turns' || !cascades.lights.length},
    {key: 'fluff', name: 'без пуха', set: on => showAll([...fluffOf('heads'), ...fluffOf('core')], !on)},
    {key: 'plants', name: 'без метёлок совсем', set: on => { plants.visible = !on; }},
    {key: 'tree', name: 'без дерева', set: on => { tree.visible = !on; }},
    {key: 'px875', name: sharpness(0.875), set: pixels(0.875)},
    {key: 'px75', name: sharpness(0.75), set: pixels(0.75)},
  ];

  // what the box at the top says
  const el = (tag, text) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; return e; };
  const bold = text => { const p = el('p'); p.append(el('b', text)); return p; };
  const tell = (lines, extra = []) => { testBox.replaceChildren(...lines.map(l => typeof l === 'string' ? el('p', l) : l), ...extra); testBox.hidden = false; };
  const eta = s => { s = FAST ? s/4 : s; return s > 90 ? `${Math.round(s/60)} мин` : `${Math.max(5, Math.round(s/5)*5)} с`; };

  // where the numbers go: the artifact's database (one write at a time), and the page remembers a measurement it is in,
  // so if the phone closes the page, the next one says where it stopped
  let dbReady = null, run = null, saving = Promise.resolve(), saved = '';
  function save(){
    const body = JSON.parse(JSON.stringify(run)), id = run.id;
    saving = saving.then(async () => {
      const db = await dbReady; if (!db){ saved = 'нет базы'; return; }
      try { await db.collection('runs').doc(id).set(body); saved = 'ok'; } catch (e) { saved = e?.code || e?.message || String(e); }
    });
    return saving;
  }
  let lastTest = null;
  try { lastTest = JSON.parse(memory?.getItem('bob.world.test') || 'null'); memory?.removeItem('bob.world.test'); } catch {}
  const mark = s => { try { s ? memory?.setItem('bob.world.test', JSON.stringify(s)) : memory?.removeItem('bob.world.test'); } catch {} };

  async function device(){                                             // what this phone is, as far as a page can tell
    let gpu = {};
    try { const a = await navigator.gpu?.requestAdapter(), i = a?.info || {};
      gpu = {vendor: i.vendor || '', architecture: i.architecture || '', description: i.description || '', f16: !!a?.features.has('shader-f16')}; } catch {}
    return {ua: navigator.userAgent, screen: `${screen.width}×${screen.height} @${devicePixelRatio}`, canvas: `${canvas.width}×${canvas.height}`,
      pixels: renderer.getPixelRatio(), level: LEVEL, quality: QUALITY[LEVEL], look: fieldInfo.look, settle: SETTLE.on, plumes: fieldInfo.plumes,
      blades: fieldInfo.blades, tree: treeTrouble ? 'не загрузилось' : LIGHT.tree,
      shadows: LIGHT.shadows ? `${LIGHT.cascades}×${LIGHT.shadowMap}, ${SHADOWS === 'once' ? 'один раз' : 'по очереди'}` : 'нет',
      cores: navigator.hardwareConcurrency || null, stamps: !!renderer.backend.trackTimestamp, gpu};
  }
  async function idleBeat(){                                           // frames with nothing drawn: 60 a second, 30 in Low Power Mode
    const dt = []; let last = null;
    measure = now => { if (last !== null) dt.push(now - last); last = now; };
    await wait(1200); measure = testFrame;
    return r1(quantile(dt, 0.5));
  }
  async function shortRun(){
    const parts = SWITCHES.filter(v => !v.skip?.()), base = {key: 'base', name: 'всё как есть', base: true};
    const plan = [base, ...parts, base, ...[...parts].reverse(), base];
    for (let i = 0; i < plan.length; i++){
      const v = plan[i], left = plan.slice(i).reduce((s, x) => s + (x.base ? 6 : 6.5), 0);
      tell([bold(`Замер · шаг ${i + 1} из ${plan.length} · ещё ~${eta(left)}`), `Сейчас: ${v.name}`,
        'Не трогай экран. Картинка будет меняться — так и надо.']);
      mark({kind: 'short', step: i + 1, name: v.name});
      const row = {key: v.key, name: v.name, round: i <= parts.length + 1 ? 1 : 2, ...(v.base ? {base: true} : {})};
      try {
        if (!v.base) await v.set(true);
        Object.assign(row, await measured(i === 0 ? 3000 : v.base ? 1500 : 2000, 4000));
      } catch (e) { row.error = String(e?.message || e); }
      try { if (!v.base) await v.set(false); } catch (e) { row.error ||= 'возврат: ' + (e?.message || e); }
      run.rows.push(row); save();
    }
  }
  async function longRun(){
    const total = FAST ? 20e3 : 20*60e3, t0 = performance.now(), mm = s => `${Math.floor(s/60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
    const stop = el('button', 'Стоп'), go = {};
    go.promise = new Promise(r => { go.end = r; }); stopNow = go;
    stop.addEventListener('click', () => { go.done = true; go.end(); stop.textContent = 'Останавливаю…'; });
    tell([bold('Долгий замер · начинаю'), 'Можно положить телефон, только не блокируй экран.'], [stop]);
    await wait(1500);
    for (let k = 1; performance.now() - t0 < total && !go.done; k++){
      hiddenNow = false;
      const s = await sample(10000), t = (performance.now() - t0)/1000;
      run.log.push({t: Math.round(t), ...s, ...(hiddenNow ? {dark: true} : {})});
      mark({kind: 'long', step: k, name: `${mm(t)} из ${mm(total/1000)}`});
      tell([bold(`Долгий замер · ${mm(t)} из ${mm(total/1000)}`), `Сейчас: ${s.fps ?? '—'} кадров/с · видеокарта ${s.gpu ?? '—'} мс на кадр`,
        'Можно положить телефон, только не блокируй экран.'], [stop]);
      if (k % 6 === 0) save();
    }
    stopNow = null;
  }

  // the outcome: each switch against «всё как есть», from both rounds
  function summary(){
    const rows = run.rows.filter(r => !r.error), of = k => rows.filter(r => r.key === k);
    const bG = mean(of('base').map(r => r.gpu)), bD = mean(of('base').map(r => r.done));
    return [...new Set(run.rows.map(r => r.key))].map(k => {
      const a = of(k), g = mean(a.map(r => r.gpu)), d = mean(a.map(r => r.done)), any = run.rows.find(r => r.key === k), vs = !any.base;
      return {key: k, name: any.name, gpu: r1(g), dGpu: vs && g !== null && bG !== null ? r1(g - bG) : null,
        done: r1(d), dDone: vs && d !== null && bD !== null ? r1(d - bD) : null, frame: r1(mean(a.map(r => r.frame))),
        fps: r1(mean(a.map(r => r.fps))), late: r1(mean(a.map(r => r.late))), cpu: r1(mean(a.map(r => r.cpu))), p90: r1(mean(a.map(r => r.gpu90))),
        each: a.map(r => r.fps ?? '—').join(' / '),
        draws: a[0]?.draws ?? null, drawsMin: a.length ? Math.min(...a.map(r => r.drawsMin ?? Infinity)) : null, tris: a[0]?.tris ?? null,
        error: a.length ? undefined : any.error};
    });
  }
  const signed = x => x === null ? '' : ` (${x > 0 ? '+' : ''}${x})`;
  function report(){                                                   // the same as text, to copy into the chat
    const d = run.device, lines = [`Замер мира Боба · ${run.kind === 'long' ? 'долгий' : 'короткий'} · ${run.at}`,
      `качество: ${d.quality} · тени: ${d.shadows} · холст ${d.canvas} · экран ${d.screen} · пустой кадр ${run.idle ?? '—'} мс · не гаснет: ${d.awake ? 'да' : 'нет'}`,
      `видеокарта: ${[d.gpu.vendor, d.gpu.architecture, d.gpu.description].filter(Boolean).join(' / ') || '—'} · таймер видеокарты: ${d.stamps ? 'есть' : 'нет'}`];
    if (run.previousStop) lines.push(`в прошлый раз замер прервался: ${run.previousStop.name}`);
    if (run.kind === 'long') for (const e of run.log) lines.push(`${e.t} с | ${e.fps ?? '—'} к/с | кадр ${e.frame ?? '—'} / 95% ${e.frame95 ?? '—'} | видеокарта ${e.gpu ?? '—'} | готов ${e.done ?? '—'}${e.dark ? ' | экран гас' : ''}`);
    else {
      const st = d.stamps;                                             // without the GPU's clock: when the GPU said it was done
      lines.push(`что | кадров/с | по кругам | опаздывает | ${st ? 'видеокарта' : 'готов'} мс (разница) | ${st ? '9 из 10 кадров ≤ | ' : ''}процессор мс | вызовов | треугольников`);
      for (const s of summary()) lines.push(`${s.name} | ${s.fps ?? '—'} | ${s.each} | ${s.late ?? '—'}% | ${st ? `${s.gpu ?? '—'}${signed(s.dGpu)}` : `${s.done ?? '—'}${signed(s.dDone)}`} | `
        + `${st ? `${s.p90 ?? '—'} | ` : ''}${s.cpu ?? '—'} | ${s.draws ?? '—'} | ${s.tris ?? '—'}${s.error ? ' | ошибка: ' + s.error : ''}`);
    }
    if (run.error) lines.push('ошибка: ' + run.error);
    return lines.join('\n');
  }
  function results(){
    const text = report(), area = el('textarea'), table = el('table'), row = el('div'), copy = el('button', 'Скопировать'), close = el('button', 'Закрыть');
    area.value = text; area.readOnly = true; row.className = 'row'; row.append(copy, close);
    copy.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(text); copy.textContent = 'Скопировано ✓'; }
      catch { area.focus(); area.select(); copy.textContent = 'Текст выделен — скопируй его'; }
    });
    close.addEventListener('click', () => { testBox.hidden = true; });
    const line = (...cells) => { const tr = table.insertRow(); cells.forEach(c => { tr.insertCell().textContent = c; }); };
    const stamps = run.device.stamps;
    if (run.kind === 'long'){
      const avg = (list, f) => r1(mean(list.map(f))), first = run.log.slice(0, 6), last = run.log.slice(-6);
      line('', 'кадров/с', stamps ? 'видеокарта, мс' : 'готов, мс');
      line('первая минута', avg(first, e => e.fps) ?? '—', avg(first, e => stamps ? e.gpu : e.done) ?? '—');
      line('последняя минута', avg(last, e => e.fps) ?? '—', avg(last, e => stamps ? e.gpu : e.done) ?? '—');
    } else {
      line('', 'кадров/с', 'опаздывает');
      for (const s of summary()) line(s.name, s.error ? 'ошибка' : s.fps ?? '—', s.late === null || s.late === undefined ? '—' : `${s.late}%`);
    }
    const kept = el('p'), say = () => { kept.textContent = saved === 'ok' ? 'Цифры сохранены. Напиши мне в чат «готово».'
      : `Сохранить не вышло (${saved || 'нет связи'}). Нажми «Скопировать» и пришли текст мне.`; };
    say(); saving.then(say);                                           // a late save still turns it to «сохранены»
    tell([bold('Готово ✓'), kept], [table, area, row]);
  }

  async function startTest(kind){
    if (measure) return;
    const $ = id => document.getElementById(id);
    $('panel').hidden = true; $('lightBtn').setAttribute('aria-expanded', 'false');
    $('lightBtn').hidden = true; hud.hidden = true;                    // their blur would cost the GPU too
    tell([bold('Готовлюсь…')]);
    dbReady ||= (globalThis.claude?.use ? globalThis.claude.use('db') : Promise.resolve(null)).catch(() => null);
    let lock = null; try { lock = await navigator.wakeLock?.request('screen'); } catch {}   // keep the screen on, where allowed
    renderer.backend.trackTimestamp = !!renderer.backend.device?.features.has('timestamp-query');
    paceReset(); pixels0 = renderer.getPixelRatio(); measure = testFrame;   // all its pixels while measuring; it adapts again after
    run = {id: `run-${Date.now()}`, kind, at: new Date().toISOString(), finished: false, device: {...await device(), awake: !!lock}, rows: [], log: []};
    if (lastTest){ run.previousStop = lastTest; lastTest = null; }
    const atMost = (p, ms) => Promise.race([p, new Promise(r => setTimeout(r, ms))]);
    // the first write now, so a question about keeping the data comes while the phone is still in hand
    tell([bold('Готовлюсь…'), 'Если спросят про сохранение данных — разреши.']); save(); await atMost(saving, 20000);
    try {
      while (skyFrames > 0) await new Promise(r => setTimeout(r, 100));   // the scene is whole first: its sky drawn
      run.idle = await idleBeat();
      await (kind === 'long' ? longRun() : shortRun());
    } catch (e) { run.error = String(e?.message || e); }
    run.finished = true; run.end = new Date().toISOString(); mark(null);
    measure = null; win = null; renderer.backend.trackTimestamp = false;
    try { await lock?.release(); } catch {}
    tell([bold('Сохраняю…')]); save(); await atMost(saving, 10000);
    results(); $('lightBtn').hidden = false; hud.hidden = false;
  }
  document.getElementById('testShort').addEventListener('click', () => startTest('short'));
  document.getElementById('testLong').addEventListener('click', () => startTest('long'));

  step('frames');
  let frames = 0, total = 0, t0 = performance.now();
  const note = ` · качество: ${QUALITY[LEVEL]}` + (fell ? ` · в прошлый раз закрылось: ${STEPS[lastStep] || lastStep}` : '')
    + (treeTrouble ? ` · дерево не загрузилось: ${treeTrouble}` : '') + (lastTest ? ` · замер прервался: ${lastTest.name}` : '');
  renderer.setAnimationLoop(now => {
    if (measure){ measure(now); frames = 0; t0 = now; return; }        // a measurement draws its own frames
    draw(); frames++; pace(now);
    if (++total === 60) step('done');                                  // it got its frames: it did not fall
    if (now - t0 > 1000){
      const sharp = paceStep ? ` · чёткость ${renderer.getPixelRatio().toFixed(2).replace('.', ',')} (телефон не держал 60)` : '';
      hud.textContent = `${Math.round(frames*1000/(now - t0))} кадров/с · ${renderer.backend.isWebGPUBackend ? 'WebGPU' : 'WebGL2'} · солнце ${SUN.az}°/${SUN.el}° · метёлки ${fieldInfo.look}${note}${sharp}`;
      frames = 0; t0 = now;
    }
  });
  window.world = {renderer, scene, camera, atmosphere, sun, cascades, pipeline, tree, field, fieldInfo, setSun, windStrength, windDir, parts, hazeDensity, airParts, sunMap, sunCam, sunView, frame, air, airAtlas, drawAir, fieldRT, groundRT, redrawShadows, setLook, draw, SETTLE, settleKeep, crisp, settle, settled, sharpened, skyTarget, skyScene, drawSky, startTest, SWITCHES, lastRun: () => run,
    pace, paceReset, paceState: () => ({step: paceStep, off: paceOff, trying: !!paceTry, pixels: renderer.getPixelRatio()}),
    setExposure: e => { renderer.toneMappingExposure = e; }};   // for checking from the console
} catch (err) {
  hud.textContent = 'Не запустилось: ' + err.message;
  step('done');                                                        // an error it could say, not a fall
  console.error(err);
}
</script>
