<script type="module">
/* ═══ Bob's world, rebuilt the way Ghost of Tsushima builds its frame (ios/design/GHOST-PIPELINE-PLAN.md).
   Step 2 — the frame's skeleton: one physical sky that gives the sky's colour, the sun's colour and the light the sky
   throws on everything (Bruneton's precomputed scattering with Hillaire's multiple scattering —
   @takram/three-atmosphere); light in physical units; the sun's shadows in cascades; the film curve (AgX).
   Step 5 — the field, as Ghost builds its grass: every blade drawn by the GPU from a few templates, placed in clumps,
   less detail farther away, one wind for everything, and one law of light. (The white plumes of his picture came first;
   on 2026-10-28 he chose grass instead — the plumes are in the history, commit 2f876e0.)
   No light is painted: change the sun and the whole frame follows ═══ */
import * as THREE from 'three/webgpu';
import { pass, context, texture, vec2, vec3, vec4, float, saturation, attribute, uniform, time, mx_noise_float, cameraPosition,
  normalize, cross, dot, uv, Fn, cameraViewMatrix, cos, sin, select, mix, abs, exp, fract, smoothstep, length, Loop, rtt,
  positionGeometry, positionWorld, normalWorld, normalView, positionViewDirection, diffuseColor, BRDF_Lambert, getViewPosition,
  screenUV, mrt, output, positionView, luminance, nodeObject, passTexture, floor } from 'three/tsl';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { CSMShadowNode } from 'three/addons/csm/CSMShadowNode.js';
import { Ellipsoid, Geodetic, radians } from '@takram/three-geospatial';
import { AtmosphereContext, AtmosphereLight, AtmosphereLightNode, skyBackground, getSplitScalarIlluminance } from '@takram/three-atmosphere/webgpu';

// the numbers of the world
const CAM = {pos: [0, 2.1, -7], look: [0, 11.4, 43], fov: 25};      // his picture's telephoto view up the hill
const PLACE = {lon: 140.81, lat: 42.83, height: 300};                // a meadow below Mount Yōtei, Hokkaido
const SUN = {az: 8, el: 12};                                         // degrees from straight ahead (+ to the left), above the horizon:
                                                                     // low behind the tree: crown and grass glow through the haze (his pick)
const EXPOSURE = 7;                                                  // the camera's exposure, for light in physical units
// the grade, where Ghost puts its art (after the light, never in it): white balance toward his warm evening, more colour
const GRADE = {white: [1, 1, 1], saturation: 1.3};
// the sky, as Ghost's local tone mapping keeps it: darker than the light it throws, so its blue stays deep
const SKY = {exposure: 0.47, saturation: 2};
const TREE = {at: [6.6, 39.43], turn: 90};                           // the file follows the level (jacaranda, jacaranda-light)
// the field as Ghost of Tsushima draws it (his choice, 2026-10-28: tall grass going in waves under the wind): blades as
// curves in clumps that share their lean, height and colour, coarser farther away (Wohllaib, GDC 2021). Bands: from,
// to (m from the camera), blades per m², bends per blade, width (×); heights (m), a clump's give in the wind; colours
// from the root up, and how the grass turns greener in the field's patches
const MEADOW = {bands: [[6, 20, 520, 6, 1.3], [20, 36, 260, 3, 1.8], [36, 56, 120, 2, 2.6]], height: [0.5, 1.1], width: 0.012,
  perClump: 16, flex: [1, 1.6], seed: 91, root: [0.12, 0.065, 0.025], body: [0.48, 0.3, 0.1], tip: [0.72, 0.54, 0.25], green: [0.8, 1, 0.55],
  warm: [1.06, 0.94, 0.78], cool: [0.92, 1, 1.04], waves: 0.18,      // a clump's own hue, from warm to cool; how much the wind's waves lighten it
  light: {glow: 1, bounced: 0.9}};                                   // how much sun a blade lets through; the field's gold thrown back up
// smoothing over time (as Ghost's TAA): on or off, how much of the frames before each new frame keeps, how far they may
// stray from the colours around each pixel now (in spreads), and how much crispness is given back after
const SETTLE = {on: true, keep: 0.88, clip: 1.0, sharpen: 0.35};
// light bounced off the open field (Ghost adds the sun's bounce off the ground to its ambient): the field's albedo, for
// the tree and the air (the grass takes its own, MEADOW.light)
const BOUNCE = {field: 0.25};
// the air (Ghost thickens it by art: physically the air between us and a hill 50 m away is almost clear): how thick at
// the ground (per m), how fast it thins with height (m), Mie's pull toward the sun (Henyey–Greenstein g) and how much
// of its light takes that pull, the steps out to each kept distance along a ray (worked out once, so they can be many),
// and how far it reaches over the sky (the haze lies over our field, the air beyond is clear); its share of the screen
// follows the level (LIGHT.air)
const HAZE = {density: 0.0015, height: 6, g: 0.7, forward: 0.6, steps: 24, skyFar: 70};
const WIND = {dir: [-0.95, 0.3], strength: 0.55};                    // one wind for the whole world: where it blows, how hard
const THROUGH = 3;                                                   // how strongly sunlight comes through the tree's leaves
// for trying values from the address: ?az=…&el=…&exp=…&through=…&haze=…
{ const q = new URLSearchParams(location.search), n = k => q.has(k) ? +q.get(k) : undefined;
  SUN.az = n('az') ?? SUN.az; SUN.el = n('el') ?? SUN.el; HAZE.density = n('haze') ?? HAZE.density;
  globalThis.TRY = {exp: n('exp'), through: n('through'), msaa: n('msaa'), steps: n('steps'), level: n('level')}; }

// ══ Lighter on a phone. Safari on an iPhone closes a page that takes too much memory ("A problem repeatedly occurred").
// The page remembers which step of loading it began last: if it never got as far as its first frames, the phone closed
// it, and next time it starts a level lighter and says where it stopped. Levels: 0 full (a computer), 1 a phone, 2 the
// lightest (no sun shadows). The panel's «Качество» picks one (kept, and in the address as #q=…; a pick that fell is
// dropped, so a phone never gets stuck closing); ?level=… tries one
const STEPS = {gpu: 'видеокарта', sky: 'небо', field: 'поле', tree: 'дерево', frames: 'первые кадры'};
const memory = (() => { try { const m = localStorage; m.setItem('bob.check', '1'); m.removeItem('bob.check'); return m; } catch { return null; } })();
const lastStep = memory?.getItem('bob.world.step'), lastLevel = Number(memory?.getItem('bob.world.level') ?? NaN);
const fell = !!lastStep && lastStep !== 'done';                      // last time it began a step and never got its frames
const onPhone = /iPhone|iPad|iPod|Android/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
const QUALITY = ['полное', 'телефон', 'самое лёгкое'], auto = onPhone ? 1 : 0;
const picked = (() => { const h = (location.hash.match(/q=([0-2])/) || [])[1]; if (h !== undefined) return +h;
  const m = memory?.getItem('bob.world.quality'); return m === null || m === undefined ? undefined : +m; })();
let LEVEL = TRY.level ?? picked ?? auto;
if (fell && TRY.level === undefined){
  LEVEL = Math.min(2, Math.max(auto, (Number.isNaN(lastLevel) ? LEVEL : lastLevel) + 1));
  try { memory?.removeItem('bob.world.quality'); } catch {}
  if (/q=/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
}
const step = s => { try { memory?.setItem('bob.world.step', s); memory?.setItem('bob.world.level', String(LEVEL)); } catch {} };
// per level: pixels per screen point at most, sun shadow cascades and their size, the tree and its maps, how much grass
// (a share), the air's share of the screen. (The lighter tree, thinned by merging its leaves, shows holes in the crown
// even 46 m away — ios/design/framing/tree-before-after.jpg — so the full level keeps the full one)
const LIGHT = [
  {pixels: 2, shadows: true, cascades: 3, shadowMap: 2048, tree: 'jacaranda', maps: '', grass: 1, air: 0.5},
  {pixels: 1.5, shadows: true, cascades: 2, shadowMap: 1024, tree: 'jacaranda-light', maps: '-512', grass: 0.6, air: 0.35},
  {pixels: 1.25, shadows: false, cascades: 2, shadowMap: 1024, tree: 'jacaranda-light', maps: '-512', grass: 0.35, air: 0.25},
][LEVEL];

const hud = document.getElementById('hud'), canvas = document.getElementById('view');
let treeTrouble = '';                                                 // why the tree did not load, if it did not
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const sm = (a, b, x) => { const q = Math.min(1, Math.max(0, (x - a)/(b - a))); return q*q*(3 - 2*q); };
const lin = c => c.map(v => Math.pow(v, 2.2));
function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0)/4294967296; }; }
function bez(p0, p1, p2, p3, t){ const u = 1 - t; return p0.clone().multiplyScalar(u*u*u).addScaledVector(p1, 3*u*u*t).addScaledVector(p2, 3*u*t*t).addScaledVector(p3, t*t*t); }
function bezD(p0, p1, p2, p3, t){ const u = 1 - t;
  return p1.clone().sub(p0).multiplyScalar(3*u*u).addScaledVector(p2.clone().sub(p1), 6*u*t).addScaledVector(p3.clone().sub(p2), 3*t*t); }
// the hill: it rises away from us to a crest ~46 m out, higher on the left, where the tree stands
const ground = (x, z) => 5.2*sm(0, 46, z)*(0.85 + 0.15*Math.sin(x*0.06 + 1.3)) + 0.13*x*sm(0, 46, z) - 4*sm(47, 75, z)
  + 0.35*sm(15, 46, z)*Math.sin(x*0.45 + 0.7) + 0.12*Math.sin(x*0.35 + z*0.11) + 0.1*Math.sin(x*1.7 + z*0.9)*Math.sin(z*1.3 - x*0.6);
// the top of the dense layer of leaves: from this camera nothing lower shows, so the ground is drawn there; farther
// away the layer looks thicker (more stalks behind each other), so it reaches higher
const leafTop = z => 0.95 + 0.3*sm(15, 38, z) + 0.4*sm(38, 46, z);
const leafTopAt = z => smoothstep(15, 38, z).mul(0.3).add(smoothstep(38, 46, z).mul(0.4)).add(0.95);   // the same, on the GPU

try {
  if (fell) hud.textContent = `в прошлый раз закрылось на шаге «${STEPS[lastStep] || lastStep}» — облегчаю (уровень ${LEVEL})`;
  step('gpu');
  const renderer = new THREE.WebGPURenderer({canvas, antialias: false});
  renderer.setPixelRatio(Math.min(LIGHT.pixels, devicePixelRatio || 1, 1900/document.documentElement.clientHeight));   // no more than a phone's pixels
  const pixelsMax = renderer.getPixelRatio();                          // (fewer, if this phone cannot keep 60 frames a second)
  await renderer.init();
  renderer.shadowMap.enabled = true;
  renderer.toneMapping = THREE.AgXToneMapping;
  renderer.toneMappingExposure = TRY.exp ?? EXPOSURE;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(CAM.fov, 1, 0.5, 600);
  camera.position.set(...CAM.pos); camera.lookAt(...CAM.look);

  // the one sky: where on Earth we stand, and where the sun is
  step('sky');
  const atmosphere = new AtmosphereContext();
  atmosphere.camera = camera;
  renderer.contextNode = context({...renderer.contextNode.value, getAtmosphere: () => atmosphere});
  const here = new Geodetic(radians(PLACE.lon), radians(PLACE.lat), PLACE.height).toECEF();
  Ellipsoid.WGS84.getNorthUpEastFrame(here, atmosphere.matrixWorldToECEF.value);   // our x: north, y: up, z: east
  const sunUp = uniform(0), sunDir = uniform(new THREE.Vector3());    // the sun's height (the sine of its angle), its direction
  let onSun = () => {};                                                // what else follows the sun (the air's shadows)
  function setSun(az = SUN.az, el = SUN.el){
    SUN.az = az; SUN.el = el;
    const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);
    sunUp.value = Math.sin(e);
    const L = new THREE.Vector3(Math.sin(a)*Math.cos(e), Math.sin(e), Math.cos(a)*Math.cos(e));
    sunDir.value.copy(L);
    atmosphere.sunDirectionECEF.value.copy(L.clone().transformDirection(atmosphere.matrixWorldToECEF.value));
    onSun();
  }
  setSun();

  // the sun and the sky's light on everything, with the sun's shadows in cascades (sharp near us, coarser far away)
  renderer.library.addLight(AtmosphereLightNode, AtmosphereLight);
  const sun = new AtmosphereLight(120);
  sun.castShadow = LIGHT.shadows; sun.shadow.mapSize.set(LIGHT.shadowMap, LIGHT.shadowMap);
  sun.target.position.set(0, 4, 25);
  // the camera, the sun, the tree and the hill hold still, and the grass casts no shadow, so the shadows are drawn once
  // and again only when the sun moves (drawing them every frame took more than a quarter of a phone's frame). The
  // cascades copy this from the sun's shadow when they are made
  sun.shadow.autoUpdate = false; sun.shadow.needsUpdate = true;
  const cascades = new CSMShadowNode(sun, {cascades: LIGHT.cascades, maxFar: 140, mode: 'practical', lightMargin: 40});
  sun.shadow.shadowNode = cascades;
  scene.add(sun, sun.target);
  let shadowFrames = 30;                                               // frames left to draw them afresh (at the start: till all is built)
  const redrawShadows = (frames = 2) => { shadowFrames = Math.max(shadowFrames, frames); };

  // ── the wind, as in Ghost of Tsushima: one direction and strength for everything, and gusts from two layers of noise
  // drifting with it — large slow swells across the field and small quick ones (Rockenbeck, GDC 2021)
  const windDir = uniform(new THREE.Vector2(...WIND.dir).normalize()), windStrength = uniform(WIND.strength);
  const gustAt = Fn(([xz]) => {
    const big = mx_noise_float(vec3(xz.mul(0.04).sub(windDir.mul(time.mul(0.45))), time.mul(0.03))).mul(0.5).add(0.5);
    const small = mx_noise_float(vec3(xz.mul(0.16).sub(windDir.mul(time.mul(1.1))), time.mul(0.15))).mul(0.5).add(0.5);
    return windStrength.mul(float(0.3).add(big.mul(big).mul(1.1)).add(small.mul(0.3)));
  });
  // the light on the open field around us — the sun's at its height and the sky's — from the atmosphere; what the field
  // bounces back up lights everything from below
  const openLight = () => { const o = getSplitScalarIlluminance(atmosphere.cameraPositionUnit.add(atmosphere.altitudeCorrectionUnit), atmosphere.sunDirectionECEF);
    return o.get('direct').mul(sunUp).add(o.get('indirect')); };
  // big patches of colour over the field (Ghost of Yōtei's plains: "waves of gold"), where the grass is greener
  const macroAt = xz => smoothstep(0.42, 0.75, mx_noise_float(vec3(xz.mul(0.09), 3.1)).mul(0.35).add(0.5)
    .add(mx_noise_float(vec3(xz.mul(0.23), 7)).mul(0.15)));
  // the gusts and the patches are the same for a whole clump, the light on the field for the whole scene, so they are
  // worked out once into small pictures — the gusts and patches into a map of the field, half a metre a pixel, every
  // frame; the light into one pixel, after the sun moves — and every point of a clump reads its clump's value there,
  // instead of working the noise out again at each point (on the phone that cost a sixth of the frame)
  const MAP = {x: [-12, 12], z: [-2, 50], perM: 2};
  const fieldRT = new THREE.RenderTarget((MAP.x[1] - MAP.x[0])*MAP.perM, (MAP.z[1] - MAP.z[0])*MAP.perM, {type: THREE.HalfFloatType, depthBuffer: false});
  const groundRT = new THREE.RenderTarget(1, 1, {type: THREE.HalfFloatType, depthBuffer: false});
  const fieldQuad = new THREE.QuadMesh(new THREE.NodeMaterial()), groundQuad = new THREE.QuadMesh(new THREE.NodeMaterial());
  { const xz = vec2(mix(float(MAP.x[0]), float(MAP.x[1]), uv().x), mix(float(MAP.z[0]), float(MAP.z[1]), uv().y));
    fieldQuad.material.fragmentNode = vec4(gustAt(xz), macroAt(xz), 0, 1);
    groundQuad.material.fragmentNode = vec4(openLight(), 1); }
  const fieldAt = xz => texture(fieldRT.texture, xz.sub(vec2(MAP.x[0], MAP.z[0])).div(vec2(MAP.x[1] - MAP.x[0], MAP.z[1] - MAP.z[0]))).level(0);
  const groundLight = texture(groundRT.texture, vec2(0.5, 0.5)).level(0).rgb;
  let groundFrames = 90;                                               // (the atmosphere's tables are built over the first frames)
  function fieldNow(){
    const was = renderer.getRenderTarget();
    renderer.setRenderTarget(fieldRT); fieldQuad.render(renderer);
    if (groundFrames > 0){ groundFrames--; renderer.setRenderTarget(groundRT); groundQuad.render(renderer); }
    renderer.setRenderTarget(was);
  }

  // ══ The grass. A clump is a set of blades, each a middle line the GPU makes into a ribbon. Per point: where it is,
  // which way the line runs, which side of the ribbon and how wide, how far up the clump it is (for the wind: 0 at the
  // root, 1 and more toward the tips), its own timing, the blade's normal, and how much light reaches it there
  class Strips {
    constructor(){ Object.assign(this, {P: [], T: [], K: [], N: [], UV: [], I: [], n: 0}); }
    add(pts, o){
      const m = pts.length, base = this.n;
      for (let j = 0; j < m; j++){

        fps: r1(mean(a.map(r => r.fps))), late: r1(mean(a.map(r => r.late))), f95: r1(mean(a.map(r => r.frame95))),
        cpu: r1(mean(a.map(r => r.cpu))), p90: r1(mean(a.map(r => r.gpu90))),
        each: a.map(r => r.fps ?? '—').join(' / '),
        draws: a[0]?.draws ?? null, drawsMin: a.length ? Math.min(...a.map(r => r.drawsMin ?? Infinity)) : null, tris: a[0]?.tris ?? null,
        error: a.length ? undefined : any.error};
    });
  }
  const signed = x => x === null ? '' : ` (${x > 0 ? '+' : ''}${x})`;
  function report(){                                                   // the same as text, to copy into the chat
    const d = run.device, lines = [`Замер мира Боба · ${run.kind === 'long' ? 'долгий' : 'короткий'} · ${run.at}`,
      `качество: ${d.quality} · тени: ${d.shadows} · холст ${d.canvas} · экран ${d.screen} · пустой кадр ${run.idle ?? '—'} мс · не гаснет: ${d.awake ? 'да' : 'нет'}`,
      `видеокарта: ${[d.gpu.vendor, d.gpu.architecture, d.gpu.description].filter(Boolean).join(' / ') || '—'} · её спрашивали о времени: ${ASK_GPU ? 'да' : 'нет'}`];
    if (run.previousStop) lines.push(`в прошлый раз замер прервался: ${run.previousStop.name}`);
    const st = d.stamps;                                               // the GPU's own clock, only when asked (?gpu)
    if (run.kind === 'long') for (const e of run.log) lines.push(`${e.t} с | ${e.fps ?? '—'} к/с | опоздало ${e.late ?? '—'}% | кадр ${e.frame ?? '—'} / 95% ${e.frame95 ?? '—'}`
      + `${st ? ` | видеокарта ${e.gpu ?? '—'}` : ''}${e.dark ? ' | экран гас' : ''}`);
    else {
      lines.push(`что | кадров/с | по кругам | опаздывает | кадр мс, 95% ≤ | ${st ? 'видеокарта мс (разница) | 9 из 10 кадров ≤ | ' : ''}процессор мс | вызовов | треугольников`);
      for (const s of summary()) lines.push(`${s.name} | ${s.fps ?? '—'} | ${s.each} | ${s.late ?? '—'}% | ${s.f95 ?? '—'} | `
        + `${st ? `${s.gpu ?? '—'}${signed(s.dGpu)} | ${s.p90 ?? '—'} | ` : ''}${s.cpu ?? '—'} | ${s.draws ?? '—'} | ${s.tris ?? '—'}${s.error ? ' | ошибка: ' + s.error : ''}`);
    }
    if (run.error) lines.push('ошибка: ' + run.error);
    return lines.join('\n');
  }
  function results(){
    const text = report(), area = el('textarea'), table = el('table'), row = el('div'), copy = el('button', 'Скопировать'), close = el('button', 'Закрыть');
    area.value = text; area.readOnly = true; row.className = 'row'; row.append(copy, close);
    copy.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(text); copy.textContent = 'Скопировано ✓'; }
      catch { area.focus(); area.select(); copy.textContent = 'Текст выделен — скопируй его'; }
    });
    close.addEventListener('click', () => { testBox.hidden = true; });
    const line = (...cells) => { const tr = table.insertRow(); cells.forEach(c => { tr.insertCell().textContent = c; }); };
    if (run.kind === 'long'){
      const avg = (list, f) => r1(mean(list.map(f))), first = run.log.slice(0, 6), last = run.log.slice(-6);
      line('', 'кадров/с', 'опаздывает');
      line('первая минута', avg(first, e => e.fps) ?? '—', `${avg(first, e => e.late) ?? '—'}%`);
      line('последняя минута', avg(last, e => e.fps) ?? '—', `${avg(last, e => e.late) ?? '—'}%`);
    } else {
      line('', 'кадров/с', 'опаздывает');
      for (const s of summary()) line(s.name, s.error ? 'ошибка' : s.fps ?? '—', s.late === null || s.late === undefined ? '—' : `${s.late}%`);
    }
    const kept = el('p'), say = () => { kept.textContent = saved === 'ok' ? 'Цифры сохранены. Напиши мне в чат «готово».'
      : `Сохранить не вышло (${saved || 'нет связи'}). Нажми «Скопировать» и пришли текст мне.`; };
    say(); saving.then(say);                                           // a late save still turns it to «сохранены»
    tell([bold('Готово ✓'), kept], [table, area, row]);
  }

  async function startTest(kind){
    if (measure) return;
    const $ = id => document.getElementById(id);
    $('panel').hidden = true; $('lightBtn').setAttribute('aria-expanded', 'false');
    $('lightBtn').hidden = true; hud.hidden = true;                    // their blur would cost the GPU too
    tell([bold('Готовлюсь…')]);
    dbReady ||= (globalThis.claude?.use ? globalThis.claude.use('db') : Promise.resolve(null)).catch(() => null);
    let lock = null; try { lock = await navigator.wakeLock?.request('screen'); } catch {}   // keep the screen on, where allowed
    renderer.backend.trackTimestamp = ASK_GPU && !!renderer.backend.device?.features.has('timestamp-query');
    paceReset(); pixels0 = renderer.getPixelRatio(); measure = testFrame;   // all its pixels while measuring; it adapts again after
    run = {id: `run-${Date.now()}`, kind, at: new Date().toISOString(), finished: false, device: {...await device(), awake: !!lock}, rows: [], log: []};
    if (lastTest){ run.previousStop = lastTest; lastTest = null; }
    const atMost = (p, ms) => Promise.race([p, new Promise(r => setTimeout(r, ms))]);
    // the first write now, so a question about keeping the data comes while the phone is still in hand
    tell([bold('Готовлюсь…'), 'Если спросят про сохранение данных — разреши.']); save(); await atMost(saving, 20000);
    try {
      while (skyFrames > 0) await new Promise(r => setTimeout(r, 100));   // the scene is whole first: its sky drawn
      run.idle = await idleBeat();
      await (kind === 'long' ? longRun() : shortRun());
    } catch (e) { run.error = String(e?.message || e); }
    run.finished = true; run.end = new Date().toISOString(); mark(null);
    measure = null; win = null; renderer.backend.trackTimestamp = false;
    try { await lock?.release(); } catch {}
    tell([bold('Сохраняю…')]); save(); await atMost(saving, 10000);
    results(); $('lightBtn').hidden = false; hud.hidden = false;
  }
  document.getElementById('testShort').addEventListener('click', () => startTest('short'));
  document.getElementById('testLong').addEventListener('click', () => startTest('long'));

  step('frames');
  let frames = 0, total = 0, t0 = performance.now();
  const note = ` · качество: ${QUALITY[LEVEL]}` + (fell ? ` · в прошлый раз закрылось: ${STEPS[lastStep] || lastStep}` : '')
    + (treeTrouble ? ` · дерево не загрузилось: ${treeTrouble}` : '') + (lastTest ? ` · замер прервался: ${lastTest.name}` : '');
  renderer.setAnimationLoop(now => {
    if (measure){ measure(now); frames = 0; t0 = now; return; }        // a measurement draws its own frames
    draw(); frames++; pace(now);
    if (++total === 60) step('done');                                  // it got its frames: it did not fall
    if (now - t0 > 1000){
      const sharp = paceStep ? ` · чёткость ${renderer.getPixelRatio().toFixed(2).replace('.', ',')} (телефон не держал 60)` : '';
      hud.textContent = `${Math.round(frames*1000/(now - t0))} кадров/с · ${renderer.backend.isWebGPUBackend ? 'WebGPU' : 'WebGL2'} · солнце ${SUN.az}°/${SUN.el}°${note}${sharp}`;
      frames = 0; t0 = now;
    }
  });
  window.world = {renderer, scene, camera, atmosphere, sun, cascades, pipeline, tree, field, fieldInfo, setSun, windStrength, windDir, parts, hazeDensity, airParts, sunMap, sunCam, sunView, frame, air, airAtlas, drawAir, fieldRT, groundRT, redrawShadows, draw, SETTLE, settleKeep, crisp, settle, settled, sharpened, skyTarget, skyScene, drawSky, startTest, SWITCHES, lastRun: () => run,
    pace, paceReset, paceState: () => ({step: paceStep, off: paceOff, trying: !!paceTry, pixels: renderer.getPixelRatio()}),
    setExposure: e => { renderer.toneMappingExposure = e; }};   // for checking from the console
} catch (err) {
  hud.textContent = 'Не запустилось: ' + err.message;
  step('done');                                                        // an error it could say, not a fall
  console.error(err);
}
</script>
