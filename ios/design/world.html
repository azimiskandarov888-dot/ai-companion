<style>
/* one phone-shaped picture in the middle of the screen; a small line of numbers under it for checking; bottom right, a
   small sun button opens sliders for the sun, the air and the wind (to choose the light by eye) */
:root { --bg: #0b0d0c; --fg: #d9d4c7; --muted: #8b8778; --glass: rgba(12, 14, 13, 0.62); --line: rgba(255, 255, 255, 0.16); --accent: #e8b46a; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); margin: 0; font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; overflow: hidden; }
#view { display: block; margin: 0 auto; height: 100%; }
#hud { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  color: var(--muted); pointer-events: none; white-space: pre; font-variant-numeric: tabular-nums; }
#lightBtn { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--glass); color: var(--accent);
  font: 20px/1 system-ui, sans-serif; cursor: pointer; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
#lightBtn:focus-visible, #panel input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#panel { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(60px + env(safe-area-inset-bottom, 0px));
  width: min(280px, calc(100vw - 24px)); padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); font: 13px/1.3 system-ui, -apple-system, sans-serif; display: grid; gap: 10px; }
#panel[hidden] { display: none; }
#panel label { display: grid; gap: 4px; color: var(--fg); }
#panel span { color: var(--muted); font-variant-numeric: tabular-nums; }
#panel input { width: 100%; accent-color: var(--accent); }

{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",

<script type="module">
/* ═══ Bob's world, rebuilt the way Ghost of Tsushima builds its frame (ios/design/GHOST-PIPELINE-PLAN.md).
   Step 2 — the frame's skeleton: one physical sky that gives the sky's colour, the sun's colour and the light the sky
   throws on everything (Bruneton's precomputed scattering with Hillaire's multiple scattering —
   @takram/three-atmosphere); light in physical units; the sun's shadows in cascades; the film curve (AgX).
   Step 5 — the field, as Ghost builds its grass: every plant drawn by the GPU from a few templates, placed by rules in
   clumps, less detail farther away, one wind for everything, and one law of light — fluff answers it as Ghost's fuzz.
   No light is painted: change the sun and the whole frame follows ═══ */
import * as THREE from 'three/webgpu';
import { pass, context, texture, vec2, vec3, vec4, float, saturation, attribute, uniform, time, mx_noise_float, cameraPosition,
  normalize, cross, dot, uv, Fn, cameraViewMatrix, cos, sin, select, mix, abs, exp, sqrt, fract, smoothstep, length, Loop, rtt,
  positionGeometry, positionWorld, normalWorld, normalView, positionViewDirection, diffuseColor, BRDF_Lambert, getViewPosition,
  screenCoordinate, interleavedGradientNoise, mrt, output, positionView } from 'three/tsl';
import { gaussianBlur } from 'three/addons/tsl/display/GaussianBlurNode.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { CSMShadowNode } from 'three/addons/csm/CSMShadowNode.js';
import { Ellipsoid, Geodetic, radians } from '@takram/three-geospatial';
import { AtmosphereContext, AtmosphereLight, AtmosphereLightNode, skyBackground, getSplitScalarIlluminance } from '@takram/three-atmosphere/webgpu';

// the numbers of the world
const CAM = {pos: [0, 2.1, -7], look: [0, 11.4, 43], fov: 25};      // his picture's telephoto view up the hill
const PLACE = {lon: 140.81, lat: 42.83, height: 300};                // a meadow below Mount Yōtei, Hokkaido
const SUN = {az: 8, el: 12};                                         // degrees from straight ahead (+ to the left), above the horizon:
                                                                     // low behind the tree: crown and fluff glow through the haze (his pick)
const EXPOSURE = 7;                                                  // the camera's exposure, for light in physical units
// the grade, where Ghost puts its art (after the light, never in it): white balance toward his warm evening, more colour
const GRADE = {white: [1, 1, 1], saturation: 1.3};
// the sky, as Ghost's local tone mapping keeps it: darker than the light it throws, so its blue stays deep
const SKY = {exposure: 0.47, saturation: 2};
const TREE = {file: 'field-assets/ph/jacaranda.gltf.json', at: [6.6, 39.43], turn: 90};
// the plume of his picture, tuned against it over many rounds (field.html): a fan of feather-like racemes on a golden
// stalk with its leaves and twigs
const PLUME = {racemes: 13, rLenCm: 22, spread: 0.26, curl: 0.7, droop: 0.45, lean: 0.15, featherMM: 13, height: 1.45, thickMM: 7,
  leaves: 8, leafLen: 0.5, twigs: 4, seed: 7};
// kinds of head, as in a real field: most are ordinary; some are big or very big, some very small, some not opened yet
// (closed), some thin and not fluffy. w: how common; q: how it differs from the plume's numbers
const KINDS = [
  {w: 3,   q: {}},                                                                       // ordinary
  {w: 2.5, q: {racemes: 0.85, rLenCm: 0.9, spread: 1.2, droop: 1.2}},                    // ordinary, more open
  {w: 0.8, q: {racemes: 1.35, rLenCm: 1.4, spread: 1.2, droop: 1.15, featherMM: 1.1}},   // big
  {w: 0.3, q: {racemes: 1.7, rLenCm: 1.85, spread: 1.15, droop: 1.3, featherMM: 1.2}},   // very big
  {w: 0.7, q: {spread: 0.2, droop: 0.1, curl: 0.15, rLenCm: 1.1}},                      // closed: not opened yet
  {w: 0.6, q: {racemes: 0.6, rLenCm: 0.55}},                                            // very small
  {w: 0.6, q: {racemes: 0.8, featherMM: 0.65, thin: 1}},                                // thin, not fluffy
];
// the field: plumes per m² by distance from the camera (near from D[0], middle from D[1], far from D[2] to the crest);
// each tier with less detail (racemes, leaves, bends; a little wider feathers to make up for fewer)
const FIELD = {D: [6, 20, 36, 55], density: {near: 5.5, mid: 6.5, far: 9}, seed: 12345};
const DETAIL = {near: {r: 1, rSeg: 5, l: 1, lSeg: 6, sSeg: 8, w: 1}, mid: {r: 0.6, rSeg: 3, l: 0.5, lSeg: 3, sSeg: 4, w: 1.15},
  far: {r: 0.4, rSeg: 2, l: 0.25, lSeg: 2, sSeg: 3, w: 1.35}};
// grass between the plumes, out of the leaf layer: [from, to (m from the camera), blades per m², bends per blade]
const GRASS = {bands: [[6, 18, 120, 4], [18, 34, 80, 3]], height: [0.3, 0.72], width: 0.011, perClump: 12, seed: 77};
// how fluff takes light: Ghost's fuzz (its outline's glow), the sun through thin fluff, the light scattered all through
// it, how solid its dense core is (alpha → coverage), and the silky sheen along its fibres (Kajiya–Kay, as hair): how
// bright, how sharp, and how far the fibres slant out from a raceme's rib (radians)
const FLUFF = {fuzz: 0.6, through: 2.5, inside: 0.1, cover: 1.7, shine: 0.6, sharp: 40, slant: 0.5};
// light bounced off the open field (Ghost adds the sun's bounce off the ground to its ambient): the field's albedo — white
// plumes and gold — and how much of it fluff takes from all around (the plumes light each other)
const BOUNCE = {field: 0.25, fluff: 0.06};
// the air (Ghost thickens it by art: physically the air between us and a hill 50 m away is almost clear): how thick at
// the ground (per m), how fast it thins with height (m), Mie's pull toward the sun (Henyey–Greenstein g) and how much
// of its light takes that pull, the steps along each ray, how far the march goes (and over the sky: the haze lies over
// our field, the air beyond is clear), and its share of the screen
const HAZE = {density: 0.0015, height: 6, g: 0.7, forward: 0.6, steps: 20, far: 160, skyFar: 70, scale: 0.5};
const WIND = {dir: [-0.95, 0.3], strength: 0.55};                    // one wind for the whole world: where it blows, how hard
const THROUGH = 3;                                                   // how strongly sunlight comes through the tree's leaves
// for trying values from the address: ?az=…&el=…&exp=…&through=…&haze=…
{ const q = new URLSearchParams(location.search), n = k => q.has(k) ? +q.get(k) : undefined;
  SUN.az = n('az') ?? SUN.az; SUN.el = n('el') ?? SUN.el; HAZE.density = n('haze') ?? HAZE.density;
  globalThis.TRY = {exp: n('exp'), through: n('through')}; }

const hud = document.getElementById('hud'), canvas = document.getElementById('view');
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const sm = (a, b, x) => { const q = Math.min(1, Math.max(0, (x - a)/(b - a))); return q*q*(3 - 2*q); };
const lin = c => c.map(v => Math.pow(v, 2.2));
function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0)/4294967296; }; }
function bez(p0, p1, p2, p3, t){ const u = 1 - t; return p0.clone().multiplyScalar(u*u*u).addScaledVector(p1, 3*u*u*t).addScaledVector(p2, 3*u*t*t).addScaledVector(p3, t*t*t); }
function bezD(p0, p1, p2, p3, t){ const u = 1 - t;
  return p1.clone().sub(p0).multiplyScalar(3*u*u).addScaledVector(p2.clone().sub(p1), 6*u*t).addScaledVector(p3.clone().sub(p2), 3*t*t); }
// the hill: it rises away from us to a crest ~46 m out, higher on the left, where the tree stands
const ground = (x, z) => 5.2*sm(0, 46, z)*(0.85 + 0.15*Math.sin(x*0.06 + 1.3)) + 0.13*x*sm(0, 46, z) - 4*sm(47, 75, z)
  + 0.35*sm(15, 46, z)*Math.sin(x*0.45 + 0.7) + 0.12*Math.sin(x*0.35 + z*0.11) + 0.1*Math.sin(x*1.7 + z*0.9)*Math.sin(z*1.3 - x*0.6);
// the top of the dense layer of leaves: from this camera nothing lower shows, so the ground is drawn there; farther
// away the layer looks thicker (more stalks behind each other), so it reaches higher
const leafTop = z => 0.95 + 0.3*sm(15, 38, z) + 0.4*sm(38, 46, z);
const leafTopAt = z => smoothstep(15, 38, z).mul(0.3).add(smoothstep(38, 46, z).mul(0.4)).add(0.95);   // the same, on the GPU

try {
  const renderer = new THREE.WebGPURenderer({canvas, antialias: false});
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1, 1900/document.documentElement.clientHeight));   // no more than a phone's pixels
  await renderer.init();
  renderer.shadowMap.enabled = true;
  renderer.toneMapping = THREE.AgXToneMapping;
  renderer.toneMappingExposure = TRY.exp ?? EXPOSURE;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(CAM.fov, 1, 0.5, 600);
  camera.position.set(...CAM.pos); camera.lookAt(...CAM.look);

  // the one sky: where on Earth we stand, and where the sun is
  const atmosphere = new AtmosphereContext();
  atmosphere.camera = camera;
  renderer.contextNode = context({...renderer.contextNode.value, getAtmosphere: () => atmosphere});
  const here = new Geodetic(radians(PLACE.lon), radians(PLACE.lat), PLACE.height).toECEF();
  Ellipsoid.WGS84.getNorthUpEastFrame(here, atmosphere.matrixWorldToECEF.value);   // our x: north, y: up, z: east
  const sunUp = uniform(0), sunDir = uniform(new THREE.Vector3());    // the sun's height (the sine of its angle), its direction
  let onSun = () => {};                                                // what else follows the sun (the air's shadows)
  function setSun(az = SUN.az, el = SUN.el){
    SUN.az = az; SUN.el = el;
    const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);
    sunUp.value = Math.sin(e);
    const L = new THREE.Vector3(Math.sin(a)*Math.cos(e), Math.sin(e), Math.cos(a)*Math.cos(e));
    sunDir.value.copy(L);
    atmosphere.sunDirectionECEF.value.copy(L.clone().transformDirection(atmosphere.matrixWorldToECEF.value));
    onSun();
  }
  setSun();

  // the sun and the sky's light on everything, with the sun's shadows in cascades (sharp near us, coarser far away)
  renderer.library.addLight(AtmosphereLightNode, AtmosphereLight);
  const sun = new AtmosphereLight(120);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  sun.target.position.set(0, 4, 25);
  const cascades = new CSMShadowNode(sun, {cascades: 3, maxFar: 140, mode: 'practical', lightMargin: 40});
  sun.shadow.shadowNode = cascades;
  scene.add(sun, sun.target);

  // ── the wind, as in Ghost of Tsushima: one direction and strength for everything, and gusts from two layers of noise
  // drifting with it — large slow swells across the field and small quick ones (Rockenbeck, GDC 2021)
  const windDir = uniform(new THREE.Vector2(...WIND.dir).normalize()), windStrength = uniform(WIND.strength);
  const gustAt = Fn(([xz]) => {
    const big = mx_noise_float(vec3(xz.mul(0.04).sub(windDir.mul(time.mul(0.45))), time.mul(0.03))).mul(0.5).add(0.5);
    const small = mx_noise_float(vec3(xz.mul(0.16).sub(windDir.mul(time.mul(1.1))), time.mul(0.15))).mul(0.5).add(0.5);
    return windStrength.mul(float(0.3).add(big.mul(big).mul(1.1)).add(small.mul(0.3)));
  });
  // the light on the open field around us — the sun's at its height and the sky's — from the atmosphere; what the field
  // bounces back up lights everything from below
  const openLight = () => { const o = getSplitScalarIlluminance(atmosphere.cameraPositionUnit.add(atmosphere.altitudeCorrectionUnit), atmosphere.sunDirectionECEF);
    return o.get('direct').mul(sunUp).add(o.get('indirect')); };
  // big patches of colour over the field (Ghost of Yōtei's plains: "waves of gold"), gold to a deeper amber
  const macroAt = xz => smoothstep(0.42, 0.75, mx_noise_float(vec3(xz.mul(0.09), 3.1)).mul(0.35).add(0.5)
    .add(mx_noise_float(vec3(xz.mul(0.23), 7)).mul(0.15)));

  // ══ The plants. A plant is a set of strips — a stalk, the racemes of its plume, leaves, twigs — each a middle line
  // the GPU makes into a ribbon. Per point: where it is, which way the line runs, which side of the ribbon and how wide,
  // how far up the plant it is (for the wind: 0 at the root, 1 at the stalk's top, more out along a raceme), what part
  // it is, a leaf's own normal, how much light reaches it there, the middle of its plume and its own timing
  const PART = {stalk: 0, head: 1, leaf: 2}, VARIANTS = 4;
  class Strips {
    constructor(){ Object.assign(this, {P: [], T: [], K: [], N: [], C: [], UV: [], I: [], n: 0}); }
    add(pts, o){
      const m = pts.length, base = this.n;
      for (let j = 0; j < m; j++){
        const t = pts[Math.min(m - 1, j + 1)].clone().sub(pts[Math.max(0, j - 1)]).normalize(), v = j/(m - 1);
        const nr = o.normal ? o.normal(v) : t, c = o.centre || pts[0];
        for (const s of [-1, 1]){
          this.P.push(pts[j].x, pts[j].y, pts[j].z); this.T.push(t.x, t.y, t.z);
          this.K.push(s, o.width(v), o.bend0 + (o.bend1 - o.bend0)*v, o.part);
          this.N.push(nr.x, nr.y, nr.z, o.ao ? o.ao(v) : 1); this.C.push(c.x, c.y, c.z, o.phase || 0);
          this.UV.push(((o.variant || 0) + 0.5 + 0.5*s)/VARIANTS, v);
        }
      }
      for (let j = 0; j < m - 1; j++){ const a = base + 2*j; this.I.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
      this.n += 2*m;
    }
    geometry(){                                  // a phone's GPU reads at most 8 buffers: 6 per point, 2 per plant
      const g = new THREE.InstancedBufferGeometry(), f = (a, k) => new THREE.Float32BufferAttribute(a, k);
      g.setAttribute('position', f(this.P, 3)); g.setAttribute('aT', f(this.T, 3)); g.setAttribute('aK', f(this.K, 4));
      g.setAttribute('aN', f(this.N, 4)); g.setAttribute('aC', f(this.C, 4)); g.setAttribute('uv', f(this.UV, 2)); g.setIndex(this.I);
      return g;
    }
    get triangles(){ return this.I.length/3; }
  }

  // one susuki plant (Q: its numbers, D: the detail): a stalk arching a little; feathers leave its top and rise as a
  // tall plume — the lower ones open more, the tips curl outward and droop; a few bare twigs among them; twigs and
  // golden leaves lower down, the last leaf (the flag) just under the head; now and then a small young plume
  function buildPlant(Q, seed, D){
    const R = rng(seed), S = new Strips(), H = Q.height, up = V3(0, 1, 0);
    const archPhi = Math.PI*(0.8 + 0.3*R()), leanPhi = archPhi - 0.2 + 0.4*R(), arch = 0.2 + R();
    const archDir = V3(Math.cos(archPhi), 0, Math.sin(archPhi));
    const s0 = V3(), s1 = V3(0, H*0.45, 0), s2 = V3(0, H*0.8, 0).addScaledVector(archDir, H*0.04*arch), s3 = V3(0, H, 0).addScaledVector(archDir, H*0.06*arch);
    const topT = bezD(s0, s1, s2, s3, 1).normalize(), axisLen = 0.045, stalkPts = [];
    const lit = y => 0.12 + 0.88*sm(0.45*H, 1.02*H, y);              // less light reaches a part the lower it is
    for (let k = 0; k <= D.sSeg; k++) stalkPts.push(bez(s0, s1, s2, s3, k/D.sSeg));
    stalkPts.push(s3.clone().addScaledVector(topT, axisLen));
    S.add(stalkPts, {part: PART.stalk, width: v => Q.thickMM/2000*(1 - 0.3*v), bend0: 0, bend1: 1 + axisLen/H, ao: v => lit(v*H)});
    const leanDir = V3(Math.cos(leanPhi), 0, Math.sin(leanPhi)), N = Math.max(3, Math.round(Q.racemes*D.r)), W = Q.featherMM/1000*2*D.w;
    const hc = s3.clone().addScaledVector(topT, axisLen + Q.rLenCm/100*0.35);     // the middle of the plume
    for (let i = 0; i < N; i++){
      const s = N > 1 ? i/(N - 1) : 0, p0 = s3.clone().addScaledVector(topT, axisLen*s), phi = i*2.39996 + R()*0.5;
      const out = V3(Math.cos(phi), 0, Math.sin(phi)).multiplyScalar(1 - Q.lean*0.5).addScaledVector(leanDir, Q.lean).normalize();
      const theta = 0.12 + Q.spread*(0.35 + 0.65*(1 - s))*(0.75 + 0.5*R());
      const L = Q.rLenCm/100*(0.7 + 0.5*R())*(0.85 + 0.25*(1 - s));
      const d0 = topT.clone().multiplyScalar(Math.cos(theta)).addScaledVector(out, Math.sin(theta)).normalize();
      const cu = Q.curl*(0.6 + 0.6*R()), dr = Q.droop*(0.5 + R())*(0.4 + theta);
      const p1 = p0.clone().addScaledVector(d0, L*0.45), p2 = p0.clone().addScaledVector(d0, L*0.75).addScaledVector(out, L*(0.12*cu + 0.15*dr));
      const p3 = p0.clone().addScaledVector(d0, L*(0.75 - 0.2*dr)).addScaledVector(out, L*(0.25*cu + 0.3*dr)).addScaledVector(up, -L*0.45*dr);
      const pts = []; for (let k = 0; k <= D.rSeg; k++) pts.push(bez(p0, p1, p2, p3, k/D.rSeg));
      const shade = 0.82 + 0.18*R();
      S.add(pts, {part: PART.head, width: () => W/2, centre: hc, variant: Q.thin ? VARIANTS - 1 : Math.floor(R()*(VARIANTS - 1)), phase: i*1.7 + R()*2,
        bend0: 1, bend1: 1 + L/H*1.2, ao: v => shade*(0.62 + 0.38*sm(0, 0.5, v))});
    }
    for (let i = 0; i < Math.round(N*(Q.thin ? 0.5 : 0.25)); i++){   // racemes that have shed their fluff: bare golden twigs
      const p0 = s3.clone().addScaledVector(topT, axisLen*R()), phi = R()*6.283, out = V3(Math.cos(phi), 0, Math.sin(phi));
      const theta = 0.15 + Q.spread*(0.5 + 0.8*R()), L = Q.rLenCm/100*(0.6 + 0.5*R());
      const d0 = topT.clone().multiplyScalar(Math.cos(theta)).addScaledVector(out, Math.sin(theta)).normalize();
      const p3 = p0.clone().addScaledVector(d0, L).addScaledVector(up, -L*0.15*Q.droop);
      S.add([p0, p0.clone().lerp(p3, 0.5).addScaledVector(out, L*0.05), p3], {part: PART.stalk, width: v => 0.0012*(1 - 0.5*v), bend0: 1, bend1: 1 + L/H, ao: () => 0.9});

  }

  const field = new THREE.Group(), fieldInfo = {plumes: 0, blades: 0, tris: 0, draws: 0};
  const plantMat = fieldMaterial(PLUME.height, false), grassMat = fieldMaterial(0.5, true);
  { // one template per kind of head, each with a little randomness of its own, so neighbours are not clones
    const shape = k => { const R = rng(500 + k), q = KINDS[k].q, m = (key, j) => PLUME[key]*(q[key] ?? 1)*j;
      return {...PLUME, thin: q.thin || 0, racemes: Math.round(m('racemes', 0.9 + 0.2*R())), rLenCm: m('rLenCm', 0.92 + 0.16*R()),
        spread: m('spread', 0.85 + 0.3*R()), droop: m('droop', 0.7 + 0.6*R()), curl: m('curl', 0.8 + 0.4*R()), featherMM: m('featherMM', 1),
        height: PLUME.height*(0.9 + 0.2*R())}; };
    const tiers = scatter();
    for (const tier of ['near', 'mid', 'far']) KINDS.forEach((_, k) => {
      const list = tiers[tier].filter(q => q.k === k); if (!list.length) return;
      const strips = buildPlant(shape(k), PLUME.seed + k*101, DETAIL[tier]), mesh = new THREE.Mesh(instanced(strips, list), plantMat);
      mesh.castShadow = mesh.receiveShadow = true; field.add(mesh);
      fieldInfo.plumes += list.length; fieldInfo.tris += strips.triangles*list.length; fieldInfo.draws++;
    });
    // the grass, in clumps, out of the top of the leaf layer
    const R = rng(GRASS.seed);
    GRASS.bands.forEach(([d0, d1, dens, segs], b) => {
      const list = [];
      for (let n = Math.round(dens*th*(d1*d1 - d0*d0)/GRASS.perClump), i = 0; i < n; i++){
        const d = Math.sqrt(d0*d0 + R()*(d1*d1 - d0*d0)), x = (R()*2 - 1)*d*th, z = camZ + d;
        const hgt = GRASS.height[0] + (GRASS.height[1] - GRASS.height[0])*R();
        list.push({p: [x, ground(x, z) + leafTop(z) - 0.08, z, R()*6.283], s: [hgt/0.5*(0.85 + 0.3*R()), 1, 0.75 + 0.45*R(), 0.8 + 0.4*R()]});
      }
      const strips = buildGrass(GRASS.seed + b, segs), mesh = new THREE.Mesh(instanced(strips, list), grassMat);
      mesh.receiveShadow = true; field.add(mesh);
      fieldInfo.blades += list.length*GRASS.perClump; fieldInfo.tris += strips.triangles*list.length; fieldInfo.draws++;
    });
  }
  for (const m of field.children) m.frustumCulled = false;
  scene.add(field);

  // the hill, drawn at the top of the dense leaf layer: golden stalks standing close, lit ones and dark gaps; seen from
  // the side, so its stalks face us; farther away, where fine detail would only ripple, a deep gold in broad patches
  const hill = new THREE.PlaneGeometry(140, 120, 140, 120); hill.rotateX(-Math.PI/2); hill.translate(0, 0, 40);
  { const p = hill.attributes.position; for (let i = 0; i < p.count; i++) p.setY(i, ground(p.getX(i), p.getZ(i)) + leafTop(p.getZ(i))); hill.computeVertexNormals(); }
  const layer = new THREE.MeshStandardNodeMaterial({roughness: 1});
  { const W = positionWorld, dist = length(W.sub(cameraPosition)), sx = W.x.mul(34);
    const n1 = x => mx_noise_float(vec3(x, 0.5, 0.5)).mul(0.5).add(0.5);
    const st = mix(n1(sx).mul(0.65).add(n1(sx.mul(0.31).add(7)).mul(0.35)), float(0.5), smoothstep(16, 30, dist));
    const near = mix(vec3(0.08, 0.045, 0.02), vec3(0.5, 0.33, 0.15), smoothstep(0.3, 0.8, st)).mul(mix(vec3(1), vec3(1, 0.8, 0.58), macroAt(W.xz)));
    const far = vec3(0.2, 0.12, 0.05).mul(mx_noise_float(vec3(W.x.mul(0.25), W.z.mul(0.5), 2)).mul(0.25).add(0.75));
    layer.colorNode = mix(near, far, smoothstep(26, 50, dist));
    const toUs = cameraPosition.sub(W);
    layer.normalNode = normalize(cameraViewMatrix.mul(vec4(normalize(vec3(toUs.x, 0, toUs.z).normalize().mul(0.8).add(normalWorld.mul(0.6))), 0)).xyz);
  }
  const hillMesh = new THREE.Mesh(hill, layer);
  hillMesh.receiveShadow = true; scene.add(hillMesh);

  // what lets light through — the tree's leaves — glows where the sun is behind it (Frostbite's fast translucency, in
  // three.js's SSS material); shadows dim it too
  const translucent = (m, through) => Object.assign(m, {thicknessColorNode: through, thicknessDistortionNode: float(0.25),
    thicknessAmbientNode: float(0), thicknessAttenuationNode: float(0.9), thicknessPowerNode: float(3), thicknessScaleNode: float(TRY.through ?? THROUGH)});
  // the tree: Jacaranda from Poly Haven (CC0), its leaves turned to autumn (scene/import_tree.py, scene/autumn_leaves.py)
  const tex = new THREE.TextureLoader();
  const load = (n, srgb) => tex.loadAsync(`field-assets/ph/${n}.jpg`).then(t => { if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; return t; });
  const maps = {trunk: ['jacaranda_tree_trunk_diff_1k', 'jacaranda_tree_trunk_nor_gl_1k'],
    branches: ['jacaranda_tree_branches_diff_1k', 'jacaranda_tree_branches_nor_gl_1k'],
    leaves: ['jacaranda_leaves_autumn', 'jacaranda_tree_leaves_nor_gl_1k']};
  const draco = new DRACOLoader().setDecoderPath('field-assets/draco/');
  const [gltf, ...textures] = await Promise.all([new GLTFLoader().setDRACOLoader(draco).loadAsync(TREE.file),
    ...Object.values(maps).flatMap(([c, n]) => [load(c, true), load(n, false)])]);
  const texOf = {}; Object.keys(maps).forEach((k, i) => texOf[k] = [textures[2*i], textures[2*i + 1]]);
  const tree = new THREE.Group();
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    const part = Object.keys(maps).find(k => o.name.includes(k)), leaves = part === 'leaves', [map, normalMap] = texOf[part];
    const mat = leaves ? translucent(new THREE.MeshSSSNodeMaterial({map, normalMap, roughness: 0.6, side: THREE.DoubleSide}), texture(map).rgb)
      : new THREE.MeshStandardNodeMaterial({map, normalMap, roughness: 0.9});
    // the gold of the sunlit field bounced up into the crown, less deep inside it (its depth is in the vertex colour)
    const deep = o.geometry.attributes.color ? attribute('color', 'vec4').x : float(1);
    mat.emissiveNode = texture(map).rgb.mul(openLight().toVarying('vGround')).mul(BOUNCE.field/Math.PI).mul(float(1).sub(normalWorld.y).mul(0.5)).mul(deep);
    const mesh = new THREE.Mesh(o.geometry, mat);
    mesh.castShadow = mesh.receiveShadow = true; tree.add(mesh);
  });
  tree.position.set(TREE.at[0], ground(...TREE.at) - 0.1, TREE.at[1]); tree.rotation.y = THREE.MathUtils.degToRad(TREE.turn);
  scene.add(tree);

  // ══ The air (step 4). Ghost lights its haze with the sun and the sun's own shadows (froxels — Patry, SIGGRAPH 2021), so
  // shafts of light show where the air is in shadow. Here: a march along each pixel's ray, at half the screen's size,
  // through a thin haze lying low over the field and thinning with height; lit by the sky, and by the sun — more toward
  // it (Mie's forward glow, Henyey–Greenstein) — wherever the sun's view of the tree and the hill says the air is lit;
  // blurred, then laid over the frame: the frame seen through the air, plus the light the air sends us
  const AIR = 3, sunMap = new THREE.RenderTarget(1024, 1024);         // the sun's view of what shades the air
  sunMap.depthTexture = new THREE.DepthTexture(1024, 1024);
  const sunCam = new THREE.OrthographicCamera(-48, 48, 48, -48, 1, 500), sunView = uniform(new THREE.Matrix4());
  sunCam.layers.set(AIR); hillMesh.layers.enable(AIR); tree.traverse(o => o.layers.enable(AIR));
  const solid = new THREE.MeshBasicNodeMaterial({side: THREE.DoubleSide, colorWrite: false});
  function drawSunMap(){                                               // once, and when the sun moves: the tree and the hill hold still
    const at = new THREE.Vector3(2, 5, 32);
    sunCam.position.copy(at).addScaledVector(sunDir.value, 250); sunCam.lookAt(at); sunCam.updateMatrixWorld();
    const bg = scene.backgroundNode; scene.backgroundNode = null; scene.overrideMaterial = solid;
    renderer.setRenderTarget(sunMap); renderer.render(scene, sunCam); renderer.setRenderTarget(null);
    scene.overrideMaterial = null; scene.backgroundNode = bg;
    sunView.value.multiplyMatrices(sunCam.projectionMatrix, sunCam.matrixWorldInverse);   // after: the renderer sets its depth range
  }
  const hazeDensity = uniform(HAZE.density), airParts = {sun: uniform(1), sky: uniform(1), shade: uniform(1)};   // for checking
  const hillAt = (x, z) => smoothstep(0, 46, z).mul(5.2).mul(sin(x.mul(0.06).add(1.3)).mul(0.15).add(0.85)).add(x.mul(0.13).mul(smoothstep(0, 46, z)))
    .sub(smoothstep(47, 75, z).mul(4)).add(leafTopAt(z));             // the top of the leaf layer (its small ripples left out)
  // our camera, by name: inside a pass of its own a shader's "camera" is the pass's flat one
  const eye = {pos: uniform(camera.position), world: uniform(camera.matrixWorld), unproject: uniform(camera.projectionMatrixInverse)};
  function airNode(distTex){                                          // distTex: how far each pixel's surface is (the sky: the far plane)
    return Fn(() => {
      const at = uv(), d = distTex.sample(at).r;
      const dir = normalize(eye.world.mul(vec4(getViewPosition(at, float(1), eye.unproject), 0)).xyz);
      const dist = select(d.greaterThan(500).or(d.lessThan(0.1)), float(HAZE.skyFar), d.min(HAZE.far));
      const ds = dist.div(HAZE.steps), cosT = dot(dir, sunDir), g = HAZE.g;
      const hg = float((1 - g*g)/(4*Math.PI)).div(float(1 + g*g).sub(cosT.mul(2*g)).pow(1.5));
      const lux = getSplitScalarIlluminance(atmosphere.cameraPositionUnit.add(atmosphere.altitudeCorrectionUnit), atmosphere.sunDirectionECEF);
      // the sun's light turned toward us; the sky's from above and the field's bounce from below, each from half the sphere
      const sunL = lux.get('direct').mul(mix(float(1/(4*Math.PI)), hg, HAZE.forward));
      const skyL = lux.get('indirect').add(lux.get('direct').mul(sunUp).add(lux.get('indirect')).mul(BOUNCE.field)).div(2*Math.PI);
      const T = float(1).toVar(), L = vec3(0).toVar(), t = interleavedGradientNoise(screenCoordinate).mul(ds).toVar();
      Loop(HAZE.steps, () => {
        const p = eye.pos.add(dir.mul(t));
        const sigma = exp(p.y.sub(hillAt(p.x, p.z)).max(0).div(-HAZE.height)).mul(hazeDensity);
        const s = sunView.mul(vec4(p, 1)).xyz, su = vec2(s.x.mul(0.5).add(0.5), s.y.mul(-0.5).add(0.5));
        const inside = su.x.greaterThan(0).and(su.x.lessThan(1)).and(su.y.greaterThan(0)).and(su.y.lessThan(1));
        const lit = select(inside.and(texture(sunMap.depthTexture, su).level(0).r.add(0.001).lessThan(s.z)), float(0), float(1));
        L.addAssign(sunL.mul(mix(float(1), lit, airParts.shade)).mul(airParts.sun).add(skyL.mul(airParts.sky)).mul(sigma.mul(T).mul(ds)));
        T.mulAssign(exp(sigma.mul(ds).negate()));
        t.addAssign(ds);
      });
      return vec4(L, T);
    })();
  }

  // after the scene: the sky where nothing stands, darker than the light it throws (as Ghost's local tone mapping keeps
  // it); the air; then the grade and the film curve. Four samples per pixel: the fluff's soft edge becomes how much of
  // each pixel it covers
  scene.backgroundNode = vec4(saturation(skyBackground().rgb.mul(SKY.exposure), SKY.saturation), 1);
  const pipeline = new (THREE.RenderPipeline || THREE.PostProcessing)(renderer);   // renamed in r185
  // the frame, and how far each pixel's surface is (a sampled depth buffer cannot be read back, a colour can)
  const frame = pass(scene, camera, {samples: 4});
  frame.setMRT(mrt({output, distance: vec4(length(positionView), 0, 0, 1)}));
  const airTex = rtt(airNode(frame.getTextureNode('distance')), 1, 1);
  const air = gaussianBlur(airTex, null, 1.5);
  pipeline.outputNode = saturation(frame.rgb.mul(air.a).add(air.rgb).mul(vec3(...GRADE.white)), GRADE.saturation);
  onSun = drawSunMap; drawSunMap();

  function resize(){
    const box = document.documentElement, h = box.clientHeight, w = Math.min(box.clientWidth, Math.round(h*0.62)), dpr = renderer.getPixelRatio();
    canvas.style.width = w + 'px'; renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
    airTex.setSize(Math.round(w*dpr*HAZE.scale), Math.round(h*dpr*HAZE.scale));
  }
  addEventListener('resize', resize); resize();

  // the sliders: the sun's side and height, the air's thickness, the wind
  { const $ = id => document.getElementById(id), btn = $('lightBtn'), panel = $('panel');
    btn.addEventListener('click', () => { panel.hidden = !panel.hidden; btn.setAttribute('aria-expanded', String(!panel.hidden)); });
    const side = a => a < -60 ? 'справа' : a < -20 ? 'справа впереди' : a < 0 ? 'впереди' : 'за деревом';
    const show = () => { $('azOut').textContent = `${side(SUN.az)} (${SUN.az}°)`; $('elOut').textContent = `${SUN.el}°`;
      $('hazeOut').textContent = (hazeDensity.value*1e4).toFixed(0); $('windOut').textContent = Math.round(windStrength.value*100); };
    $('az').value = SUN.az; $('el').value = SUN.el; $('haze').value = Math.round(hazeDensity.value*1e4); $('wind').value = Math.round(windStrength.value*100);
    $('az').addEventListener('input', e => { setSun(+e.target.value, SUN.el); show(); });
    $('el').addEventListener('input', e => { setSun(SUN.az, +e.target.value); show(); });
    $('haze').addEventListener('input', e => { hazeDensity.value = e.target.value/1e4; show(); });
    $('wind').addEventListener('input', e => { windStrength.value = e.target.value/100; show(); });
    show(); }

  let frames = 0, t0 = performance.now();
  renderer.setAnimationLoop(now => {
    pipeline.render(); frames++;
    if (now - t0 > 1000){
      hud.textContent = `${Math.round(frames*1000/(now - t0))} кадров/с · ${renderer.backend.isWebGPUBackend ? 'WebGPU' : 'WebGL2'} · солнце ${SUN.az}°/${SUN.el}°`;
      frames = 0; t0 = now;
    }
  });
  window.world = {renderer, scene, camera, atmosphere, sun, cascades, pipeline, tree, field, fieldInfo, setSun, windStrength, windDir, parts, hazeDensity, airParts, sunMap, sunCam, sunView, frame, air, airTex,
    setExposure: e => { renderer.toneMappingExposure = e; }};   // for checking from the console
} catch (err) {
  hud.textContent = 'Не запустилось: ' + err.message;
  console.error(err);
}
</script>
