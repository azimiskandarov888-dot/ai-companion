        + (paceTarget < CADENCE.full ? ' · 30 кадров/с: телефон не держит 60, бережёт себя (через 2 мин попробует снова)'
          : paceHeld ? (inside && !touched ? ' · 30 кадров/с даёт Safari, пока не коснёшься картинки' : ' · 30 кадров/с даёт iPhone (энергосбережение или нагрев)') : '');
      hud.textContent = `${Math.round(frames*1000/(now - t0))} кадров/с · ${renderer.backend.isWebGPUBackend ? 'WebGPU' : 'WebGL2'} · солнце ${SUN.az.toFixed(1)}°/${SUN.el.toFixed(1)}°${note}${sharp}`;
      frames = 0; t0 = now;
    }
  };
  renderer.setAnimationLoop(loop);
  const setLook = old => { const v = old ? {...LOOK, ...LOOK_OLD} : LOOK; for (const k in look) look[k].value = v[k]; drawAir(); };
  window.world = {look, setLook, renderer, scene, camera, atmosphere, sun, cascades, pipeline, tree, field, fieldInfo, setSun, windStrength, windDir, parts, hazeDensity, airParts, sunMap, sunCam, sunView, frame, air, airAtlas, drawAir, fieldRT, groundRT, redrawShadows, treeWind, draw, SETTLE, settleKeep, crisp, settle, settled, sharpened, crownParts, treeColour, skyColour, sunSee, sunPeek, setMood, mood, cloudCover, cloudScale, cloudHorizon, cloudThick, cloudMist, cloudFar, cloudGain, cloudTarget, bob, setBob, body, orb, bobLight, setFlare, FLARES, pressRT, knockTree, treeKnock, treeShake, fallen, fallWind, skyTarget, skyScene, drawSky, startTest, SWITCHES, lastRun: () => run,
    whole: () => total >= 60 && !skyFrames && airWarm <= 0,   // (drawn whole — its sky done, its haze warm: the app shows it only then)
    pace, paceReset, paceState: () => ({step: paceStep, off: paceOff, trying: !!paceTry, held: paceHeld, gpuLag, pixels: renderer.getPixelRatio(), target: paceTarget}),
    setExposure: e => { renderer.toneMappingExposure = e; }};   // for checking from the console
  // ── the iOS app's door (2026-11-06): the world sits in a closed web view; Swift calls only these, with values that are
  // checked here again, and hears the world only through the message handler «bob» — first {type: 'ready'}, once the
  // world is drawn whole (the app lifts its dark only then)
  const toApp = m => { try { window.webkit?.messageHandlers?.bob?.postMessage(m); } catch {} };
  window.bobWorld = Object.freeze({
    set: b => { const c = checked(b); if (c) setBob(c); },
    mood: (v, a) => setMood(num(v, -1, 2) ?? 0, num(a, -2, 2) ?? 0),
    pause: () => renderer.setAnimationLoop(null),                      // (a screen of the app's own covers the world)
    resume: () => { lastDraw = paceLast = 0; renderer.setAnimationLoop(loop); },
    phone: level => {                                                  // 0 as usual · 1 Low Power Mode or warm · 2 hot
      phoneSays = Math.round(num(level, 0, 2) ?? 0);
      if (!phoneSays) return paceReset();
      paceTarget = CADENCE.cool; paceOff = true; paceCooled = performance.now();
      if (phoneSays > 1 && paceStep < PACE.steps.length - 1){ paceStep = PACE.steps.length - 1; setPace(); }
    }});
  { const t = setInterval(() => { if (total >= 60 && !skyFrames && airWarm <= 0){ clearInterval(t); toApp({type: 'ready'}); } }, 250); }
} catch (err) {
  hud.textContent = 'Не запустилось: ' + err.message;
  step('done');                                                        // an error it could say, not a fall
  console.error(err);
}
</script>
