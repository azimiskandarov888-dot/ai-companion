<title>Метёлка сусуки</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  Step 1 of the living world (LIVING-WORLD-RESEARCH.md): ONE susuki plume made only of numbers — v2,
  built the way it can live in a field of thousands on a phone.

  Real sizes (Miscanthus sinensis): culm 4–8 mm thick, 1–2.5 m tall; panicle 12–26 cm long, 8–10 cm
  wide, 10–36 racemes of 10–20 cm; spikelets 5–6 mm in pairs with silky hairs 4–7 mm long.

    stalk, leaves — solid thin geometry (cheap on the iPhone's tile-based GPU: no see-through pixels)
    racemes       — thin curved 3D strips that turn to face the camera (like Ghost of Tsushima's grass
                    blades); the fuzz on them is a picture
    fuzz picture  — DRAWN BY CODE from the hair numbers (hair length, fluffiness, density): real
                    spikelets with tufts of short hairs combed toward the tip. Moving a slider redraws
                    it in a moment, so everything stays editable
    light         — hair light along each raceme (Kajiya–Kay) + the sun shining through
  About 500 triangles per plume instead of ~30 000 with one thread per hair.
-->
<style>
/* Layout: the plume fills the screen; the numbers sit in a side panel on a computer and in a sheet at the bottom on a phone. */
:root{

  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--sans);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}

  width:112px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--glass);cursor:pointer;color:var(--ink);
  padding:0;transition:width .3s ease}

<script type="importmap">
{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ═══ The plume is these numbers (sizes in real units). ═══ */
const DEFAULTS = {
  racemes: 30, rLenCm: 17, spread: 0.38, droop: 0.6, lean: 0.35, fluff: 1.0, hairMM: 9, density: 1.5,
  height: 1.55, thickMM: 6, leaves: 4, leafLen: 0.6,
  color: 'silver', bright: 1.0, sunAz: 22, sunEl: 14, glow: 1.0, bg: 'picture',
  wind: 0.22, seed: 7, view: 'one',
};
const COLORS = { silver: ['Серебристая', [0.98, 0.965, 0.94]], cream: ['Кремовая', [0.98, 0.91, 0.8]],
                 young: ['Молодая', [0.9, 0.72, 0.76]], gold: ['Золотая', [0.98, 0.84, 0.6]] };
const BGS = { picture: 'Твоя картинка', dark: 'Тёмный' };
const VIEWS = { one: 'Одна метёлка', bush: 'Куст из 7' };
const P = loadParams();
function loadParams(){
  try { const s = JSON.parse(localStorage.getItem('plume2') || 'null'); if (s) return {...DEFAULTS, ...s}; } catch (e) {}
  return {...DEFAULTS};
}
function saveParams(){ try { localStorage.setItem('plume2', JSON.stringify(P)); } catch (e) {} }

/* ═══ Helpers ═══ */
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const lin = c => c.map(v => Math.pow(v, 2.2));
const sm = (a, b, x) => { const q = Math.min(1, Math.max(0, (x - a)/(b - a))); return q*q*(3 - 2*q); };
function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function bez(p0, p1, p2, p3, t){ const u = 1 - t; return p0.clone().multiplyScalar(u*u*u).addScaledVector(p1, 3*u*u*t).addScaledVector(p2, 3*u*t*t).addScaledVector(p3, t*t*t); }
function bezD(p0, p1, p2, p3, t){ const u = 1 - t;
  return p1.clone().sub(p0).multiplyScalar(3*u*u).addScaledVector(p2.clone().sub(p1), 6*u*t).addScaledVector(p3.clone().sub(p2), 3*t*t); }
const cardWidth = P => 2*P.hairMM/1000*(0.55 + 0.9*P.fluff) + 0.003;   // a raceme with its hairs spread, in metres

/* ═══ The fuzz picture, drawn by code: 4 kinds of raceme side by side ═══
   Each: a thin rachis with spikelets in pairs; every spikelet carries a tuft of short silky hairs
   combed toward the tip and spread by "fluffiness". Drawn once into a texture; redrawn when the hair
   numbers change. Colour is applied later, so changing colour costs nothing. */
const VARIANTS = 4, ATLAS = new THREE.WebGLRenderTarget(512, 1024, {samples: 4});
ATLAS.texture.generateMipmaps = true; ATLAS.texture.minFilter = THREE.LinearMipmapLinearFilter; ATLAS.texture.anisotropy = 4;
const bakeScene = new THREE.Scene(), bakeCam = new THREE.OrthographicCamera(0, 1, 1, 0, -1, 1);
const bakeMat = new THREE.LineBasicMaterial({vertexColors: true, transparent: true, depthTest: false, depthWrite: false});
const bakeLines = new THREE.LineSegments(new THREE.BufferGeometry(), bakeMat);
bakeLines.frustumCulled = false; bakeScene.add(bakeLines);
let hairsDrawn = 0;
function bakeFuzz(renderer){
  const pos = [], col = [], W = cardWidth(P), L = 0.15;      // the picture stands for 15 cm of raceme
  const seg = (x0, y0, x1, y1, c, a, v) => { pos.push((v + x0)/VARIANTS, y0, 0, (v + x1)/VARIANTS, y1, 0); col.push(...c, a, ...c, a); };
  hairsDrawn = 0;
  for (let v = 0; v < VARIANTS; v++){
    const R = rng(P.seed*31 + v*7 + 1);
    // the rachis: a few close parallel lines, slightly wavy
    for (const dx of [-0.006, 0, 0.006]){
      let px = 0.5 + dx, py = 0.0;
      for (let k = 1; k <= 24; k++){ const y = k/24, x = 0.5 + dx + Math.sin(y*9 + v)*0.006; seg(px, py, x, y, [0.7, 0.63, 0.55], 0.85, v); px = x; py = y; }
    }
    const nodes = Math.round(L/0.0045), spread = (0.2 + 0.75*P.fluff);
    for (let n = 0; n < nodes; n++){
      for (const side of [-1, 1]){
        const y0 = 0.03 + 0.94*(n + 0.5 + (R() - 0.5)*0.6)/nodes, x0 = 0.5 + side*(0.0008 + 0.0012*R())/W;
        // the spikelet: a slim seed 5 mm long
        const sl = 0.005*(0.85 + 0.3*R());
        for (const off of [-0.0004, 0, 0.0004]) seg(x0 + off/W, y0, x0 + (off + side*0.0006)/W, y0 + sl/L, [0.78, 0.7, 0.6], 0.8, v);
        // its tuft of silky hairs
        const tuft = Math.round(14*P.density*(0.8 + 0.4*R()));
        for (let h = 0; h < tuft; h++){
          const th = side*Math.abs((R() + R() + R() - 1.5)/1.5)*spread*1.1 + (R() - 0.5)*0.15;   // mostly up, fanned outward
          const len = P.hairMM/1000*(0.65 + 0.7*R()), bend = side*0.35*P.fluff*R();
          const bx = x0 + (R() - 0.5)*0.001/W, by = y0 + R()*sl*0.5/L;
          const mx = bx + Math.sin(th)*len*0.5/W, my = by + Math.cos(th)*len*0.5/L;
          const ex = mx + Math.sin(th + bend)*len*0.5/W, ey = my + Math.cos(th + bend)*len*0.5/L;
          const c = 0.86 + 0.14*R();
          seg(bx, by, mx, my, [c, c, c*0.985], 0.5, v); seg(mx, my, ex, ey, [c, c, c*0.985], 0.42, v);
          hairsDrawn++;
        }
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 4));
  bakeLines.geometry.dispose(); bakeLines.geometry = g;
  const prevTarget = renderer.getRenderTarget(), prevClear = renderer.getClearColor(new THREE.Color()), prevAlpha = renderer.getClearAlpha();
  renderer.setRenderTarget(ATLAS); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(bakeScene, bakeCam);
  renderer.setRenderTarget(prevTarget); renderer.setClearColor(prevClear, prevAlpha);
}

/* ═══ Building plumes from the numbers ═══ */
class Strips {   // ribbons along a curve; the shader widens them sideways
  constructor(){ Object.assign(this, {pos: [], tan: [], side: [], v: [], w: [], vari: [], phase: [], bend: [], nrm: [], index: [], n: 0}); }
  add(pts, o){
    const m = pts.length, base = this.n;
    for (let j = 0; j < m; j++){
      const t = pts[Math.min(m - 1, j + 1)].clone().sub(pts[Math.max(0, j - 1)]).normalize(), v = j/(m - 1);
      for (const s of [-1, 1]){
        this.pos.push(pts[j].x, pts[j].y, pts[j].z); this.tan.push(t.x, t.y, t.z); this.side.push(s); this.v.push(v);
        this.w.push(o.width(v)); this.vari.push(o.variant || 0); this.phase.push(o.phase || 0);
        this.bend.push(o.bend0 + (o.bend1 - o.bend0)*v);
        const n = o.normal ? o.normal(v) : t; this.nrm.push(n.x, n.y, n.z);
      }
    }
    for (let j = 0; j < m - 1; j++){ const a = base + 2*j; this.index.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    this.n += 2*m;
  }
  geometry(){
    const g = new THREE.BufferGeometry(), f = (a, k) => new THREE.Float32BufferAttribute(a, k);
    g.setAttribute('position', f(this.pos, 3)); g.setAttribute('aTan', f(this.tan, 3)); g.setAttribute('aSide', f(this.side, 1));
    g.setAttribute('aV', f(this.v, 1)); g.setAttribute('aW', f(this.w, 1)); g.setAttribute('aVar', f(this.vari, 1));
    g.setAttribute('aPhase', f(this.phase, 1)); g.setAttribute('aBend', f(this.bend, 1)); g.setAttribute('aNrm', f(this.nrm, 3));
    g.setIndex(this.index);
    return g;
  }
  get triangles(){ return this.index.length/3; }
}

function addPlume(Q, at, R, heads, stalks, leaves, box){
  const H = Q.height, up = V(0, 1, 0);
  const archDir = V(Math.cos(Q.archPhi), 0, Math.sin(Q.archPhi));
  const s0 = at.clone(), s1 = at.clone().add(V(0, H*0.45, 0));
  const s2 = at.clone().add(V(0, H*0.8, 0)).addScaledVector(archDir, H*0.04*Q.arch);
  const s3 = at.clone().add(V(0, H, 0)).addScaledVector(archDir, H*0.11*Q.arch);
  const topT = bezD(s0, s1, s2, s3, 1).normalize();
  // the stalk: solid, a little thinner toward the top, running up into the panicle axis
  const axisLen = Q.rLenCm/100*0.45, stalkPts = [];
  for (let k = 0; k <= 14; k++) stalkPts.push(bez(s0, s1, s2, s3, k/14));
  stalkPts.push(s3.clone().addScaledVector(topT, axisLen));
  stalks.add(stalkPts, {width: v => Q.thickMM/2000*(1 - 0.35*v), bend0: 0, bend1: 1 + axisLen/H});
  // the racemes: fingers from along the top of the axis; rise, arc outward, droop
  const leanDir = V(Math.cos(Q.leanPhi), 0, Math.sin(Q.leanPhi)), N = Math.round(Q.racemes), W = cardWidth(Q);
  for (let i = 0; i < N; i++){
    const s = N > 1 ? i/(N - 1) : 0;
    const p0 = s3.clone().addScaledVector(topT, axisLen*(1 - s)*0.95);       // lower racemes attach lower and are longer
    const phi = i*2.39996 + R()*0.6;
    const out = V(Math.cos(phi), 0, Math.sin(phi)).multiplyScalar(1 - Q.lean*0.6).addScaledVector(leanDir, Q.lean).normalize();
    const L = Q.rLenCm/100*(0.8 + 0.4*R())*(0.75 + 0.35*(1 - s));
    const theta = Q.spread*(0.25 + 0.75*R())*1.0 + 0.05;
    const d0 = topT.clone().multiplyScalar(Math.cos(theta)).addScaledVector(out, Math.sin(theta)).normalize();
    const dr = Q.droop*(0.6 + 0.4*R())*(0.6 + theta);
    const p1 = p0.clone().addScaledVector(d0, L*0.42);
    const p2 = p0.clone().addScaledVector(d0, L*0.6).addScaledVector(out, L*(0.15 + 0.25*dr));
    const p3 = p0.clone().addScaledVector(d0, L*(0.62 - 0.2*dr)).addScaledVector(out, L*(0.3 + 0.35*dr)).addScaledVector(up, -L*0.6*dr);
    const pts = []; for (let k = 0; k <= 10; k++) pts.push(bez(p0, p1, p2, p3, k/10));
    heads.add(pts, {width: v => W/2*(0.5 + 0.5*sm(0, 0.18, v))*(1 - 0.45*sm(0.65, 1, v)), variant: Math.floor(R()*VARIANTS),
                    phase: i*1.7 + R()*2, bend0: 1, bend1: 1 + L/H*2});
    for (const p of pts){ box.expandByPoint(p.clone().addScalar(W/2)); box.expandByPoint(p.clone().addScalar(-W/2)); }
  }
  // long leaves from the lower stalk: flat, arching out and drooping
  for (let i = 0; i < Math.round(Q.leaves); i++){
    const a = bez(s0, s1, s2, s3, 0.06 + 0.11*i), phi = Q.archPhi + 0.9 + i*2.3 + R()*0.6;
    const out = V(Math.cos(phi), 0, Math.sin(phi)), Ll = Q.leafLen*(0.7 + 0.5*R());
    const q1 = a.clone().addScaledVector(up, Ll*0.4).addScaledVector(out, Ll*0.1);
    const q2 = a.clone().addScaledVector(up, Ll*0.55).addScaledVector(out, Ll*0.45);
    const q3 = a.clone().addScaledVector(up, Ll*(0.25 - 0.3*R())).addScaledVector(out, Ll*0.85);
    const pts = []; for (let k = 0; k <= 16; k++) pts.push(bez(a, q1, q2, q3, k/16));
    leaves.add(pts, {width: v => 0.008*Math.min(1, v*6)*Math.pow(1 - v, 0.7), bend0: 0.06 + 0.11*i, bend1: 0.5 + 0.11*i,
      normal: v => { const T = bezD(a, q1, q2, q3, v).normalize(), sv = T.clone().cross(out).normalize(); return sv.cross(T).normalize(); }});
  }
}

function buildScene(P){
  const heads = new Strips(), stalks = new Strips(), leaves = new Strips(), box = new THREE.Box3(), R = rng(P.seed);
  const base = {...P, rLenCm: P.rLenCm, archPhi: Math.PI*0.92, leanPhi: Math.PI*0.85, arch: 0.6};
  if (P.view === 'bush'){
    for (let i = 0; i < 7; i++){
      const r = i === 0 ? 0 : 0.06 + 0.12*R(), a = i*2.4 + R();
      const Q = {...base, height: P.height*(0.82 + 0.3*R()), racemes: Math.max(6, P.racemes + Math.round((R() - 0.5)*6)),
                 rLenCm: P.rLenCm*(0.85 + 0.3*R()), lean: Math.min(1, P.lean*(0.7 + 0.6*R())), archPhi: Math.PI*(0.75 + 0.4*R()),
                 leanPhi: Math.PI*(0.7 + 0.5*R()), arch: 0.4 + 0.8*R()};
      addPlume(Q, V(Math.cos(a)*r, 0, Math.sin(a)*r), R, heads, stalks, leaves, box);
    }
  } else addPlume(base, V(), R, heads, stalks, leaves, box);
  return {heads, stalks, leaves, box};
}

/* ═══ Light and wind, shared by every part ═══ */
const WIND = `
uniform float uTime, uWind, uGust, uH;
vec3 windAt(vec3 p, float b, float phase, float v){
  float w = uWind*(0.7 + 0.3*sin(uTime*0.55)) + uGust;
  float lean = w*0.2*b*b;                                           // the plant leans with the wind
  float bob = (0.025 + 0.045*w)*sin(uTime*1.9 + phase*0.3 + p.x*3.)*b*b;   // and bobs
  float flick = 0.006*(0.3 + w)*sin(uTime*6.7 + phase*4.)*v*step(1., b);    // racemes flutter
  float x = lean + bob + flick;
  return vec3(x, -0.18*x*x/max(b, 0.2), 0.01*(0.3 + w)*sin(uTime*1.3 + phase)*b*b);
}
vec3 widen(vec3 wp, vec3 T, float side, float w){                   // turn a strip to face the camera
  vec3 toCam = normalize(cameraPosition - wp);
  return wp + normalize(cross(T, toCam))*side*w;
}`;
const LIGHT = `
uniform vec3 uSun, uSunCol, uSky; uniform float uGlow, uBright;
float back(vec3 V){ return pow(max(0., dot(-V, normalize(uSun))), 4.); }   // looking into the sun: light comes through
vec3 hairLight(vec3 base, vec3 T, vec3 V, float glow){                     // light along a hair-like thing (Kajiya–Kay)
  vec3 L = normalize(uSun);
  float tl = dot(T, L), kd = sqrt(max(0., 1. - tl*tl));
  vec3 H = normalize(L + V); float th = dot(T, H), ks = pow(sqrt(max(0., 1. - th*th)), 60.);
  return base*(uSky*0.75 + uSunCol*0.42*kd) + base*uSunCol*(ks*0.28 + back(V)*glow*(0.55 + 0.45*kd));
}`;
const uniforms = {
  uTime: {value: 0}, uWind: {value: P.wind}, uGust: {value: 0}, uH: {value: P.height},
  uSun: {value: V()}, uSunCol: {value: new THREE.Color()}, uSky: {value: new THREE.Color()},
  uHair: {value: new THREE.Color()}, uGlow: {value: P.glow}, uBright: {value: P.bright},
  uAtlas: {value: ATLAS.texture}, uVariants: {value: VARIANTS},
};
const STRIP_VS = `${WIND}
  attribute vec3 aTan, aNrm; attribute float aSide, aV, aW, aVar, aPhase, aBend;
  varying vec2 vUv; varying vec3 vT, vW; varying float vSide, vV;
  uniform float uVariants; uniform float uFlat;
  void main(){
    vec3 p = position + windAt(position, aBend, aPhase, aV);
    vec4 wp = modelMatrix*vec4(p, 1.);
    vec3 T = normalize(mat3(modelMatrix)*aTan);
    if (uFlat > .5) wp.xyz += normalize(cross(T, aNrm))*aSide*aW;     // leaves: a real flat blade
    else wp.xyz = widen(wp.xyz, T, aSide, aW);                         // stalk, racemes: always face the camera
    gl_Position = projectionMatrix*viewMatrix*wp;
    vUv = vec2((aVar + 0.5 + 0.5*aSide)/uVariants, aV); vT = T; vW = wp.xyz; vSide = aSide; vV = aV;
  }`;

const headMat = new THREE.ShaderMaterial({
  uniforms: {...uniforms, uFlat: {value: 0}}, transparent: true, depthWrite: false, premultipliedAlpha: true, side: THREE.DoubleSide,
  vertexShader: STRIP_VS,
  fragmentShader: `${LIGHT}
    uniform sampler2D uAtlas; uniform vec3 uHair;
    varying vec2 vUv; varying vec3 vT, vW; varying float vSide, vV;
    void main(){
      vec4 tx = texture2D(uAtlas, vUv);                                // premultiplied fuzz
      float a = tx.a;
      vec3 base = (tx.rgb/max(a, 1e-3))*uHair*uBright;
      vec3 col = hairLight(base, normalize(vT), normalize(cameraPosition - vW), uGlow);
      gl_FragColor = vec4(col*a, a);
    }`,
});
const stalkMat = new THREE.ShaderMaterial({
  uniforms: {...uniforms, uFlat: {value: 0}, uColor: {value: new THREE.Color(...lin([0.83, 0.68, 0.45]))}}, side: THREE.DoubleSide,
  vertexShader: STRIP_VS,
  fragmentShader: `${LIGHT}
    uniform vec3 uColor; varying vec2 vUv; varying vec3 vT, vW; varying float vSide, vV;
    void main(){
      float round_ = sqrt(max(0., 1. - vSide*vSide));                  // a thin cylinder: lighter in the middle
      vec3 col = hairLight(uColor*(0.55 + 0.45*round_), normalize(vT), normalize(cameraPosition - vW), uGlow*0.5);
      gl_FragColor = vec4(col, 1.);
    }`,
});
const leafMat = new THREE.ShaderMaterial({
  uniforms: {...uniforms, uFlat: {value: 1}, uColor: {value: new THREE.Color(...lin([0.72, 0.6, 0.36]))}}, side: THREE.DoubleSide,
  vertexShader: STRIP_VS,
  fragmentShader: `${LIGHT}
    uniform vec3 uColor; varying vec2 vUv; varying vec3 vT, vW; varying float vSide, vV;
    void main(){
      vec3 V = normalize(cameraPosition - vW), L = normalize(uSun);
      float rib = smoothstep(0.18, 0., abs(vSide));                     // the pale midrib of a susuki leaf
      vec3 c = mix(uColor, uColor*1.35 + 0.05, rib);
      float d = 0.5 + 0.5*abs(dot(normalize(cross(vT, V)), L));
      vec3 col = c*(uSky*0.6 + uSunCol*0.5*d) + c*uSunCol*back(V)*uGlow*0.7;
      gl_FragColor = vec4(col, 1.);
    }`,
});

/* ═══ Scene ═══ */
const canvas = document.getElementById('view');
let renderer;
try { renderer = new THREE.WebGLRenderer({canvas, antialias: true, powerPreference: 'high-performance'}); }
catch (e) { document.body.insertAdjacentHTML('beforeend', '<p class="msg">Этот браузер не умеет рисовать 3D (WebGL 2).</p>'); throw e; }
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.toneMapping = THREE.AgXToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(34, 1, 0.01, 60);

const backdropTex = new THREE.TextureLoader().load('plume/backdrop.jpg', t => { uniforms.uImgAspect.value = t.image.width/t.image.height; });
backdropTex.colorSpace = THREE.SRGBColorSpace;
Object.assign(uniforms, {uTex: {value: backdropTex}, uAspect: {value: 1}, uImgAspect: {value: 768/1376}, uDark: {value: 0}, uSunScreen: {value: new THREE.Vector3()}});
const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms, depthTest: false, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.9999, 1.); }`,
  fragmentShader: `uniform sampler2D uTex; uniform float uAspect, uImgAspect, uDark; uniform vec3 uSunScreen, uSunCol; varying vec2 vUv;
    void main(){
      vec2 uv = vUv;
      if (uAspect > uImgAspect) uv.y = (uv.y - .5)*uImgAspect/uAspect + .5; else uv.x = (uv.x - .5)*uAspect/uImgAspect + .5;
      vec3 c = mix(texture2D(uTex, uv).rgb, vec3(.012, .013, .018), uDark);
      vec2 d = (vUv - uSunScreen.xy)*vec2(uAspect, 1.);
      c += uSunCol*0.22*exp(-dot(d, d)*10.)*uSunScreen.z;
      gl_FragColor = vec4(c, 1.);
    }`,
}));
backdrop.frustumCulled = false; backdrop.renderOrder = -1; scene.add(backdrop);

const leafMesh = new THREE.Mesh(new THREE.BufferGeometry(), leafMat);
const stalkMesh = new THREE.Mesh(new THREE.BufferGeometry(), stalkMat);
const headMesh = new THREE.Mesh(new THREE.BufferGeometry(), headMat);
for (const m of [leafMesh, stalkMesh, headMesh]){ m.frustumCulled = false; scene.add(m); }
headMesh.renderOrder = 2;

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.enablePan = false; controls.minDistance = 0.12; controls.maxDistance = 5;
controls.minPolarAngle = 0.35; controls.maxPolarAngle = 2.1;
controls.addEventListener('start', () => document.getElementById('hint').classList.add('gone'));

const rt = new THREE.WebGLRenderTarget(1, 1, {type: THREE.HalfFloatType, samples: 4});
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.3, 0.5, 0.86));
composer.addPass(new OutputPass());

let built = null, needBake = true;
function rebuild(keepView){
  if (needBake){ bakeFuzz(renderer); needBake = false; }
  const g = buildScene(P);
  for (const [mesh, strips] of [[headMesh, g.heads], [stalkMesh, g.stalks], [leafMesh, g.leaves]]){ mesh.geometry.dispose(); mesh.geometry = strips.geometry(); }
  uniforms.uH.value = P.height;
  const center = g.box.getCenter(V()), size = g.box.getSize(V());
  if (!keepView || !built){
    controls.target.copy(center);
    camera.position.copy(center).add(V(0.08, -0.22, 1).normalize().multiplyScalar(fitDistance(size)));
  } else controls.target.copy(center);
  built = g;
  const plumes = P.view === 'bush' ? 7 : 1, tris = Math.round((g.heads.triangles + g.stalks.triangles + g.leaves.triangles)/plumes);
  document.getElementById('stats').innerHTML = `Одна метёлка — <b>≈ ${tris} треугольников</b> (раньше ≈ 30 000). Пушок нарисован ${hairsDrawn.toLocaleString('ru')} волосками.`;
  document.getElementById('json').textContent = JSON.stringify(P, null, 1);
}
function fitDistance(size){
  const v = THREE.MathUtils.degToRad(camera.fov)/2, h = Math.atan(Math.tan(v)*camera.aspect);
  const halfW = Math.max(size.x, size.z)*0.5, halfH = size.y*0.5;
  return Math.max(halfW*1.08/Math.tan(h), halfH*1.25/Math.tan(v)) + Math.max(size.x, size.z)*0.12;
}
function applyLight(){
  const az = P.sunAz*Math.PI/180, el = P.sunEl*Math.PI/180;
  uniforms.uSun.value.set(Math.sin(az)*Math.cos(el), Math.sin(el), -Math.cos(az)*Math.cos(el));
  uniforms.uSunCol.value.setRGB(...lin([1, 0.84, 0.64])).multiplyScalar(2.6);
  uniforms.uSky.value.setRGB(...lin([0.62, 0.72, 0.86]));
  uniforms.uHair.value.setRGB(...lin(COLORS[P.color][1]));
  uniforms.uGlow.value = P.glow; uniforms.uBright.value = P.bright; uniforms.uWind.value = P.wind;
  uniforms.uDark.value = P.bg === 'dark' ? 1 : 0;
}
function resize(){
  const w = innerWidth, h = innerHeight, dpr = Math.min(2, devicePixelRatio || 1);
  renderer.setSize(w, h, false); composer.setPixelRatio(dpr); composer.setSize(w, h);
  camera.aspect = w/h; camera.updateProjectionMatrix(); uniforms.uAspect.value = w/h;
}
const sunTmp = V(), fwd = V();
function render(dt){
  uniforms.uTime.value += dt; uniforms.uGust.value *= Math.exp(-dt*1.3);
  controls.update();
  camera.getWorldDirection(fwd);
  sunTmp.copy(uniforms.uSun.value).multiplyScalar(30).add(camera.position).project(camera);
  uniforms.uSunScreen.value.set(sunTmp.x*0.5 + 0.5, sunTmp.y*0.5 + 0.5, fwd.dot(uniforms.uSun.value) > 0.05 ? 1 : 0);
  composer.render();
}

/* ═══ Controls: every number is a slider ═══ */
const SLIDERS = [
  ['Головка', [['racemes', 'Веточек', 6, 30, 1], ['rLenCm', 'Длина веточек, см', 8, 25, 0.5], ['spread', 'Раскрытие', 0, 1, 0.01],
               ['droop', 'Свисание', 0, 1, 0.01], ['lean', 'Наклон в сторону', 0, 1, 0.01]]],
  ['Пушок', [['fluff', 'Пушистость', 0, 1, 0.01], ['hairMM', 'Длина волосков, мм', 3, 10, 0.1], ['density', 'Густота волосков', 0.4, 1.6, 0.01]]],
  ['Стебель и листья', [['height', 'Высота, м', 0.9, 2.4, 0.01], ['thickMM', 'Толщина стебля, мм', 3, 9, 0.1],
                       ['leaves', 'Листья', 0, 6, 1], ['leafLen', 'Длина листьев, м', 0.3, 0.9, 0.01]]],
  ['Свет', [['sunAz', 'Солнце: вокруг', -180, 180, 1], ['sunEl', 'Солнце: высота', 2, 70, 1],
            ['glow', 'Свечение насквозь', 0, 2.5, 0.01], ['bright', 'Яркость', 0.5, 1.5, 0.01]]],
  ['Ветер', [['wind', 'Сила ветра', 0, 1, 0.01]]],
];
const SHAPE = new Set(['racemes', 'rLenCm', 'spread', 'droop', 'lean', 'height', 'thickMM', 'leaves', 'leafLen']);
const BAKE = new Set(['fluff', 'hairMM', 'density']);
const groups = document.getElementById('groups');
for (const [title, items] of SLIDERS){
  const g = document.createElement('div'); g.className = 'group';
  g.innerHTML = `<h2>${title}</h2>` + items.map(([k, label, min, max, step]) =>
    `<div class="row"><label for="s-${k}">${label}</label><output id="o-${k}"></output>
     <input type="range" id="s-${k}" min="${min}" max="${max}" step="${step}"></div>`).join('');
  groups.appendChild(g);
}
const fmt = v => Number.isInteger(v) ? String(v) : (Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2));
let pendingShape = false;
function syncUI(){
  for (const [, items] of SLIDERS) for (const [k] of items){ document.getElementById('s-' + k).value = P[k]; document.getElementById('o-' + k).textContent = fmt(P[k]); }
  document.querySelectorAll('#colors .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === P.color));
  document.querySelectorAll('#bgs .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.b === P.bg));
  document.querySelectorAll('#views .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.w === P.view));
  document.querySelector('.bar [data-act="view"]').textContent = P.view === 'bush' ? 'Одна' : 'Куст';
}
groups.addEventListener('input', e => {
  const k = e.target.id.slice(2); if (!(k in P)) return;
  P[k] = +e.target.value; document.getElementById('o-' + k).textContent = fmt(P[k]);
  if (BAKE.has(k)){ needBake = true; pendingShape = true; } else if (SHAPE.has(k)) pendingShape = true; else applyLight();
  saveParams(); document.getElementById('json').textContent = JSON.stringify(P, null, 1);
});
const chipRow = (id, entries, key, data) => {
  const el = document.getElementById(id);
  el.innerHTML = Object.entries(entries).map(([k, v]) => `<button class="chip" type="button" data-${data}="${k}">${Array.isArray(v) ? v[0] : v}</button>`).join('');
  el.addEventListener('click', e => { const b = e.target.closest(`[data-${data}]`); if (!b) return; P[key] = b.dataset[data];
    if (key === 'view') rebuild(); else applyLight(); syncUI(); saveParams(); });
};
chipRow('colors', COLORS, 'color', 'c'); chipRow('bgs', BGS, 'bg', 'b'); chipRow('views', VIEWS, 'view', 'w');
document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
  const act = b.dataset.act;
  if (act === 'gust') uniforms.uGust.value = 0.9;
  if (act === 'seed'){ P.seed = (P.seed*7 + 13) % 9973; needBake = true; rebuild(true); saveParams(); }
  if (act === 'view'){ P.view = P.view === 'bush' ? 'one' : 'bush'; rebuild(); syncUI(); saveParams(); }
  if (act === 'reset'){ Object.assign(P, DEFAULTS); needBake = true; applyLight(); rebuild(); syncUI(); saveParams(); }
  if (act === 'numbers'){ const box = document.getElementById('numbers'); box.hidden = !box.hidden;
    document.querySelectorAll('[data-act="numbers"]').forEach(x => x.setAttribute('aria-pressed', !box.hidden)); }
}));
document.getElementById('copy').addEventListener('click', async e => {
  const text = JSON.stringify(P, null, 1);
  try { await navigator.clipboard.writeText(text); e.target.textContent = 'Скопировано'; }
  catch (err) { const r = document.createRange(); r.selectNodeContents(document.getElementById('json')); getSelection().removeAllRanges(); getSelection().addRange(r); e.target.textContent = 'Выделено — скопируй'; }
  setTimeout(() => e.target.textContent = 'Скопировать', 1800);
});
const panel = document.getElementById('panel'), more = document.getElementById('more');
more.addEventListener('click', () => { const open = panel.classList.toggle('open'); more.setAttribute('aria-expanded', open); more.textContent = open ? 'Свернуть' : 'Настроить'; });
document.getElementById('ref').addEventListener('click', e => e.currentTarget.classList.toggle('big'));
setTimeout(() => document.getElementById('hint').classList.add('gone'), 5000);

/* ═══ Start ═══ */
resize(); addEventListener('resize', resize);
applyLight(); rebuild(); syncUI();
let prev = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - prev)/1000); prev = now;
  if (pendingShape){ pendingShape = false; rebuild(true); }
  render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.plume = {P, rebuild, applyLight, render, renderer, atlas: ATLAS, setBake: () => { needBake = true; }};   // for checking from the console
</script>
