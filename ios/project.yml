# XcodeGen spec — generates BobCompanion.xcodeproj from these source files.
#
# This is the OPTIONAL convenience path. If you have XcodeGen
# (`brew install xcodegen`), run `xcodegen generate` in this folder and open the
# resulting BobCompanion.xcodeproj. If you'd rather not install anything, follow
# the "Create the project by hand in Xcode" steps in README.md instead — the
# Swift files are identical either way.

name: BobCompanion
options:
  bundleIdPrefix: com.yourfamily
  # 17.0, not 18 — nothing in the app needs 18, and this way every simulator
  # and every iPhone from the last few years can run it.
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Without this, Xcode's destination menu can come up empty ("No selection").
schemes:
  BobCompanion:
    build:
      targets:
        BobCompanion: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  BobCompanion:
    type: application
    platform: iOS
    sources:
      - path: BobCompanion
        excludes:
          - "App/Info.plist"      # named below instead, never copied as a resource
    # ADDING A NEW .swift FILE COSTS MORE THAN IT LOOKS. XcodeGen lists source
    # files individually at generate time, so a file added afterwards is
    # invisible to Xcode — the build fails with "Cannot find X in scope" — and
    # the obvious fix, `xcodegen generate`, ALSO throws away the signing team
    # that has to be set by hand in Xcode (DEVELOPMENT_TEAM below is empty by
    # design; it's personal, not shareable). So while someone is mid-way
    # through getting the app onto a real phone, put new code in a file that
    # already exists. Regenerate deliberately, not as a side effect.
    # NOT `info:` — that key makes XcodeGen GENERATE an Info.plist at that path,
    # overwriting the real one with $(EXECUTABLE_NAME) boilerplate on every run
    # and silently dropping the microphone permission, the local-network
    # permission and the launch screen. Point at the file instead.
    settings:
      base:
        INFOPLIST_FILE: BobCompanion/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.yourfamily.bobcompanion
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"    # iPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The eight graded photographs live in
        # BobCompanion/Resources/Assets.xcassets — drop the exports from
        # ios/design/grade/out/ straight in, keeping their names.
        # Fill these in with your Apple Developer team to run on a real device:
        # DEVELOPMENT_TEAM: XXXXXXXXXX
        # CODE_SIGN_STYLE: Automatic
