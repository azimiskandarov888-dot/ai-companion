<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Голосовой companion — тест</title>
    <style>
      :root {
        --bg: #0f1226;
        --panel: rgba(255, 255, 255, 0.05);
        --border: rgba(255, 255, 255, 0.1);
        --text: #eef0ff;
        --dim: #a6a9c8;
        --accent: #7c9cff;
        --accent-2: #59d3a8;
        --user: #2a3566;
        --rec: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(900px 500px at 70% -10%, rgba(124, 156, 255, 0.18), transparent 60%), var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
      }
      .wrap { width: 100%; max-width: 640px; padding: 24px 18px 60px; }
      header { text-align: center; margin-bottom: 8px; }
      h1 { font-size: 22px; margin: 0; }
      .sub { color: var(--dim); font-size: 14px; margin-top: 4px; }

      .status {
        margin: 18px 0;
        padding: 12px 14px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        font-size: 13px;
        color: var(--dim);
      }
      .status b { color: var(--text); }
      .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; margin-left: 6px; }
      .ok { background: rgba(89, 211, 168, 0.16); color: var(--accent-2); }
      .no { background: rgba(255, 107, 107, 0.16); color: var(--rec); }

      .mic-area { text-align: center; margin: 26px 0 10px; }
      .mic {
        width: 128px; height: 128px; border-radius: 50%;
        border: none; cursor: pointer; color: white; font-size: 15px; font-weight: 600;
        background: linear-gradient(135deg, var(--accent) 0%, #a06bff 100%);
        box-shadow: 0 12px 40px rgba(124, 156, 255, 0.35);
        transition: transform 0.1s ease;
      }
      .mic:active { transform: scale(0.97); }
      .mic.recording { background: linear-gradient(135deg, var(--rec) 0%, #ff9a6b 100%); animation: pulse 1.3s infinite; }
      @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,107,107,0.5);} 50% { box-shadow: 0 0 0 18px rgba(255,107,107,0);} }
      .hint { color: var(--dim); font-size: 13px; margin-top: 12px; min-height: 18px; }
      .ghost { margin-top: 14px; background: transparent; border: 1px solid var(--border); color: var(--dim); padding: 9px 16px; border-radius: 999px; font-size: 13.5px; cursor: pointer; }
      .ghost:hover { color: var(--text); border-color: var(--accent); }

      .convo { margin-top: 22px; display: flex; flex-direction: column; gap: 12px; }
      .msg { padding: 12px 15px; border-radius: 16px; line-height: 1.5; font-size: 15px; max-width: 85%; white-space: pre-wrap; }
      .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 5px; }
      .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
      .who { font-size: 11px; color: var(--dim); margin-bottom: 3px; }

      .text-test { margin-top: 26px; display: flex; gap: 8px; }
      .text-test input {
        flex: 1; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border);
        background: var(--panel); color: var(--text); font-size: 14px; outline: none;
      }
      .text-test button {
        padding: 0 16px; border-radius: 12px; border: none; cursor: pointer;
        background: var(--accent-2); color: #05271c; font-weight: 600;
      }
      .foot { margin-top: 26px; color: var(--dim); font-size: 12px; text-align: center; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>🎙️ Голосовой companion — тест</h1>
        <div class="sub">Нажмите кнопку, говорите по-русски, отпустите — и послушайте ответ.</div>
      </header>

      <div class="status" id="status">Проверяю подключение…</div>

      <div class="mic-area">
        <button class="mic" id="mic">Говорить</button>
        <div class="hint" id="hint">Нажмите, чтобы начать запись</div>
        <button class="ghost" id="morning">☀️ Пусть companion поздоровается первым</button>
      </div>

      <div class="convo" id="convo"></div>

      <div class="text-test">
        <input id="textInput" placeholder="…или напечатайте фразу для теста мозга+голоса" />
        <button id="textSend">Сказать</button>
      </div>

      <div class="foot">
        Это тестовая страница для проверки цепочки: уши (Whisper) → мозг (Claude) → голос (ElevenLabs).<br />
        This is a developer test page for the voice loop.
      </div>
    </div>

    <script>
      const convo = document.getElementById("convo");
      const hint = document.getElementById("hint");
      const micBtn = document.getElementById("mic");
      const statusEl = document.getElementById("status");
      const SESSION_ID = "test";

      function addMsg(who, label, text) {
        const el = document.createElement("div");
        el.className = "msg " + who;
        el.innerHTML = '<div class="who">' + label + "</div>";
        const body = document.createElement("div");
        body.textContent = text;
        el.appendChild(body);
        convo.appendChild(el);
        el.scrollIntoView({ behavior: "smooth", block: "end" });
      }

      function playAudio(base64, mime) {
        if (!base64) return;
        const audio = new Audio("data:" + (mime || "audio/mpeg") + ";base64," + base64);
        audio.play().catch(() => {});
      }

      // --- health ---
      async function loadHealth() {
        try {
          const r = await fetch("/api/health");
          const h = await r.json();
          const s = h.services;
          const pill = (ok) =>
            '<span class="pill ' + (ok ? "ok" : "no") + '">' + (ok ? "готово" : "нет ключа") + "</span>";
          statusEl.innerHTML =
            "<b>" + h.companion_name + "</b> · модель " + h.brain_model +
            "<br>🧠 Мозг (Claude)" + pill(s.brain_claude) +
            " &nbsp; 👂 Уши (Whisper)" + pill(s.ears_whisper) +
            " &nbsp; 🗣️ Голос (ElevenLabs)" + pill(s.mouth_elevenlabs) +
            (h.all_ready ? "" : "<br><small>Добавьте недостающие ключи в backend/.env и перезапустите сервер.</small>");
        } catch (e) {
          statusEl.textContent = "Не удалось связаться с сервером.";
        }
      }
      loadHealth();

      // --- proactive good-morning (the companion speaks first) ---
      document.getElementById("morning").onclick = async () => {
        hint.textContent = "Companion начинает разговор…";
        try {
          const r = await fetch("/api/proactive", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: SESSION_ID, kind: "morning" }),
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.detail || "Ошибка");
          addMsg("bot", "Companion", data.reply);
          playAudio(data.audio_base64, data.audio_mime);
        } catch (e) {
          addMsg("bot", "Ошибка", String(e.message || e));
        } finally {
          hint.textContent = "Нажмите, чтобы начать запись";
        }
      };

      // --- text test (brain + mouth, skips ears) ---
      document.getElementById("textSend").onclick = sendText;
      document.getElementById("textInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendText();
      });
      async function sendText() {
        const input = document.getElementById("textInput");
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        addMsg("user", "Вы", text);
        hint.textContent = "Думаю…";
        try {
          const r = await fetch("/api/say", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text, session_id: SESSION_ID }),
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.detail || "Ошибка");
          addMsg("bot", "Companion", data.reply);
          playAudio(data.audio_base64, data.audio_mime);
        } catch (e) {
          addMsg("bot", "Ошибка", String(e.message || e));
        } finally {
          hint.textContent = "Нажмите, чтобы начать запись";
        }
      }

      // --- voice loop (ears + brain + mouth) ---
      let mediaRecorder = null;
      let chunks = [];
      let recording = false;

      micBtn.onclick = async () => {
        if (recording) {
          stopRecording();
        } else {
          startRecording();
        }
      };

      async function startRecording() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          chunks = [];
          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) chunks.push(e.data);
          };
          mediaRecorder.onstop = () => {
            stream.getTracks().forEach((t) => t.stop());
            sendAudio(new Blob(chunks, { type: "audio/webm" }));
          };
          mediaRecorder.start();
          recording = true;
          micBtn.classList.add("recording");
          micBtn.textContent = "Стоп";
          hint.textContent = "Слушаю… нажмите «Стоп», когда закончите";
        } catch (e) {
          hint.textContent = "Нет доступа к микрофону: " + e.message;
        }
      }

      function stopRecording() {
        if (mediaRecorder && recording) {
          recording = false;
          micBtn.classList.remove("recording");
          micBtn.textContent = "Говорить";
          hint.textContent = "Обрабатываю…";
          mediaRecorder.stop();
        }
      }

      async function sendAudio(blob) {
        const form = new FormData();
        form.append("audio", blob, "audio.webm");
        form.append("session_id", SESSION_ID);
        try {
          const r = await fetch("/api/talk", { method: "POST", body: form });
          const data = await r.json();
          if (!r.ok) throw new Error(data.detail || "Ошибка");
          if (data.transcript) addMsg("user", "Вы", data.transcript);
          else addMsg("user", "Вы", "(речь не распознана)");
          if (data.reply) {
            addMsg("bot", "Companion", data.reply);
            playAudio(data.audio_base64, data.audio_mime);
          }
        } catch (e) {
          addMsg("bot", "Ошибка", String(e.message || e));
        } finally {
          hint.textContent = "Нажмите, чтобы начать запись";
        }
      }
    </script>
  </body>
</html>
